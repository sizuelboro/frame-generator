<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FrameForge — Mockup Frame Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --text:#2C2C2B; --text2:#7D7A75; --canvas:#FFFFFF; --soft:#F9F8F7; --soft2:#F0EFED;
  --border:#E6E5E3; --blue:#2783DE; --blue-soft:#E5F2FC; --green:#46A171; --green-soft:#E8F1EC;
  --orange:#D5803B; --orange-soft:#FBEBDE; --red:#E56458; --red-soft:#FCE9E7;
}
html,body{height:100%}
body{
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text); background:var(--soft); overflow:hidden;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;height:100vh}
.topbar{
  display:flex;align-items:center;gap:12px;padding:10px 16px;
  background:var(--canvas);border-bottom:1px solid var(--border);flex:0 0 auto;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:9px;margin-right:4px}
.logo{width:26px;height:26px;border-radius:7px;background:var(--text);display:grid;place-items:center}
.logo i{display:block;width:11px;height:8px;border:1.6px solid #fff;border-radius:1.5px}
.brand h1{font-size:15px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:12px;color:var(--text2);white-space:nowrap}
.sep{width:1px;height:26px;background:var(--border)}
.spacer{flex:1 1 auto}

.btn{
  display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;
  border:1px solid var(--border);border-radius:8px;background:var(--canvas);
  font-size:13.5px;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--soft2)}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#1f72c4}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft2)}
.btn.sm{min-height:28px;padding:0 9px;font-size:12.5px;border-radius:7px}
.btn.danger{color:var(--red)}
.btn.danger:hover{background:var(--red-soft)}

.body{display:flex;flex:1 1 auto;min-height:0}

/* ---------- panels ---------- */
.panel{
  width:264px;flex:0 0 264px;background:var(--canvas);display:flex;flex-direction:column;
  min-height:0;overflow-y:auto;
}
.panel.left{border-right:1px solid var(--border)}
.panel.right{border-left:1px solid var(--border);width:290px;flex-basis:290px}
.sect{padding:16px;border-bottom:1px solid var(--border)}
.sect:last-child{border-bottom:none}
.sect h2{
  font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text2);margin-bottom:12px;
}
.stack{display:flex;flex-direction:column;gap:7px}
.row{display:flex;gap:7px}
.row>*{flex:1 1 0;min-width:0}

.tool{
  display:flex;align-items:center;gap:9px;width:100%;min-height:38px;padding:0 10px;
  border:1px solid var(--border);border-radius:8px;font-size:13.5px;font-weight:500;text-align:left;
}
.tool:hover{background:var(--soft2)}
.tool.on{background:var(--blue-soft);border-color:#B9DCF7;color:#1a5d9e}
.tool .k{
  margin-left:auto;font-size:10.5px;color:var(--text2);background:var(--soft2);
  border-radius:4px;padding:1px 5px;font-weight:600;
}
.tool.on .k{background:#fff;color:#1a5d9e}
.ic{width:17px;height:17px;flex:0 0 17px;display:block}

/* ---------- layers ---------- */
.layers{display:flex;flex-direction:column;gap:4px}
.layer{
  display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;
  border:1px solid transparent;cursor:pointer;
}
.layer:hover{background:var(--soft)}
.layer.on{background:var(--blue-soft);border-color:#B9DCF7}
.layer .thumb{
  width:30px;height:30px;flex:0 0 30px;border-radius:6px;border:1px solid var(--border);
  background:var(--soft2) center/cover no-repeat;display:grid;place-items:center;overflow:hidden;
}
.layer .meta{flex:1 1 auto;min-width:0}
.layer .nm{font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer .ty{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer.dim .nm,.layer.dim .ty{opacity:.45}
.iconbtn{
  width:26px;height:26px;flex:0 0 26px;border-radius:6px;display:grid;place-items:center;color:var(--text2);
}
.iconbtn:hover{background:var(--soft2);color:var(--text)}
.iconbtn.act{color:var(--blue)}
.empty{font-size:12.5px;color:var(--text2);padding:8px 2px;line-height:1.45}

/* ---------- stage ---------- */
.stage{
  flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column;
  background:var(--soft);position:relative;
}
.stagebar{
  display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);
  background:var(--canvas);flex:0 0 auto;font-size:12.5px;color:var(--text2);flex-wrap:wrap;
}
.pill{
  display:inline-flex;align-items:center;gap:5px;background:var(--soft2);border-radius:999px;
  padding:3px 10px;font-size:11.5px;font-weight:600;color:var(--text);
}
.pill.blue{background:var(--blue-soft);color:#1a5d9e}
.pill.green{background:var(--green-soft);color:#2f7a52}
.pill.orange{background:var(--orange-soft);color:#a25f24}
.canvaswrap{
  flex:1 1 auto;min-height:0;overflow:auto;display:grid;place-items:center;padding:28px;
}
.board{
  position:relative;
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.06);
  background:#fff;border-radius:2px;
}
#cv{display:block;border-radius:2px;touch-action:none}
.hint{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
  background:rgba(44,44,43,.92);color:#fff;font-size:12px;padding:6px 12px;border-radius:999px;
  pointer-events:none;opacity:0;transition:opacity .18s;white-space:nowrap;max-width:92%;
}
.hint.show{opacity:1}

/* ---------- fields ---------- */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;font-weight:600;color:var(--text2)}
.inp{
  width:100%;min-height:32px;padding:5px 9px;border:1px solid var(--border);border-radius:7px;
  background:var(--canvas);font-size:13px;
}
.inp:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
input[type=range]{width:100%;accent-color:var(--blue);min-height:28px}
input[type=color]{width:100%;height:32px;padding:2px;border:1px solid var(--border);border-radius:7px;background:#fff}
.val{font-size:11.5px;color:var(--text2);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--text2);line-height:1.45}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:3px 0}
.kv b{font-weight:600}
.chip{
  display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:7px;
  padding:4px 8px;font-size:12px;font-weight:550;background:var(--canvas);
}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tpl{
  display:flex;align-items:center;gap:9px;padding:7px;border:1px solid var(--border);border-radius:8px;
}
.tpl .thumb{width:42px;height:30px;flex:0 0 42px;border-radius:5px;border:1px solid var(--border);background:var(--soft2) center/cover no-repeat}
.tpl .nm{flex:1 1 auto;min-width:0;font-size:12.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hidden{display:none!important}

@media (max-width:1100px){
  .body{flex-direction:column;overflow-y:auto}
  .panel,.panel.right{width:100%;flex-basis:auto;border:none;border-bottom:1px solid var(--border)}
  .stage{min-height:62vh}
}
</style>

<style id="ff-folder-picker-styles">
.ff-folder-backdrop{position:fixed;inset:0;z-index:20000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(15,17,21,.52);font:14px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#171717}
.ff-folder-dialog{display:grid;gap:16px;width:min(460px,calc(100vw - 32px));max-height:min(680px,calc(100vh - 32px));padding:20px;border:1px solid #e6e5e3;border-radius:14px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.28)}
.ff-folder-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.ff-folder-titles{display:grid;gap:3px}.ff-folder-eyebrow{color:#2783de;font-size:11px;font-weight:750;letter-spacing:.12em}.ff-folder-dialog h2{margin:0;font-size:22px;line-height:1.2}.ff-folder-dialog p{margin:0;color:#6f6d69;font-size:13px}.ff-folder-icon{display:grid;place-items:center;width:36px;height:36px;padding:0;border:1px solid transparent;border-radius:8px;background:#fff;color:#444;font-size:22px;cursor:pointer}.ff-folder-icon:hover{background:#f0efed}
.ff-folder-list{display:grid;gap:6px;min-height:52px;max-height:330px;overflow:auto;padding:2px}.ff-folder-row{display:grid;grid-template-columns:28px minmax(0,1fr) 24px;align-items:center;gap:8px;width:100%;min-height:48px;padding:8px 12px;border:1px solid #e6e5e3;border-radius:10px;background:#fff;color:#2c2c2b;text-align:left;cursor:pointer}.ff-folder-row:hover{background:#f9f8f7}.ff-folder-row.selected{border-color:#8b3dff;background:#f4ecff;color:#5f1abd}.ff-folder-row-icon{font-size:18px}.ff-folder-row-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}.ff-folder-check{font-size:16px;font-weight:750;text-align:center}
.ff-folder-create{display:grid;gap:8px}.ff-folder-new{justify-self:start;min-height:40px;padding:8px 12px;border:1px solid #d9d7d3;border-radius:8px;background:#fff;color:#5f1abd;font-weight:650;cursor:pointer}.ff-folder-new:hover{background:#f4ecff}.ff-folder-fieldrow{display:none;grid-template-columns:minmax(0,1fr) auto;gap:8px}.ff-folder-fieldrow.show{display:grid}.ff-folder-input{min-width:0;height:42px;padding:8px 11px;border:1px solid #b8b6b2;border-radius:8px;font:inherit;outline:none}.ff-folder-input:focus{border-color:#8b3dff;box-shadow:0 0 0 2px rgba(139,61,255,.15)}.ff-folder-add,.ff-folder-primary{min-height:42px;padding:8px 14px;border:1px solid #8b3dff;border-radius:8px;background:#8b3dff;color:#fff;font-weight:700;cursor:pointer}.ff-folder-add:disabled{opacity:.55}.ff-folder-error:empty{display:none}.ff-folder-error{padding:9px 10px;border-radius:8px;background:#fce9e7;color:#9a2820;font-size:12px}.ff-folder-actions{display:flex;justify-content:flex-end;gap:8px}.ff-folder-secondary{min-height:42px;padding:8px 14px;border:1px solid #d9d7d3;border-radius:8px;background:#fff;color:#2c2c2b;font-weight:650;cursor:pointer}
@media(max-width:540px){.ff-folder-backdrop{align-items:flex-end;padding:0}.ff-folder-dialog{width:100%;max-height:88vh;border-radius:16px 16px 0 0;padding:18px}.ff-folder-list{max-height:40vh}}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="logo"><i></i></div>
      <div>
        <h1>FrameForge</h1>
        <span>Mockup frame studio</span>
      </div>
    </div>
    <div class="sep"></div>
    <button class="btn" id="btnNew">New</button>
    <button class="btn" id="btnLoadJson">Open JSON</button>
    <button class="btn" id="btnSaveJson">Save JSON</button>
    <div class="sep"></div>
    <button class="btn" id="btnSaveTpl">Save as mockup</button>
    <div class="spacer"></div>
    <span class="pill" id="sizePill">1200 × 800</span>
    <button class="btn" id="btnFitCanvas">Fit canvas</button>
    <button class="btn" id="btnLibrarySettings">Library settings</button>
    <button class="btn primary" id="btnPublishCloud">Publish to Canva Dev</button>
    <button class="btn" id="btnBulk100" title="Process and publish up to 100 overlays or silhouettes">Bulk 100</button>
    <button class="btn" id="btnAutoScreen">Auto screen</button>
    <button class="btn" id="btnSilhouetteFrame" title="Trace the visible subject into one native Canva drop target">Silhouette frame</button>
    <button class="btn" id="btnPickOpening">Pick opening</button>
    <button class="btn" id="btnOpeningBleed" title="Alpha-aware expansion: hides gaps but stops beneath thin artwork borders">Auto bleed: 6px</button>
    <button class="btn" id="btnRemoveBg">Remove bg</button>
    <button class="btn" id="btnCanvaPdf">Canva frame PDF</button>
    <button class="btn" id="btnMockupPdf">Canva mockup PDF</button>
    <button class="btn" id="btnBundleAdd">+ Bundle</button>
    <button class="btn" id="btnBundleExport">Bundle PDF</button>
    <button class="btn" id="btnExportOverlay">Export overlay PNG</button>
    <button class="btn primary" id="btnExport">Export PNG</button>
  </header>

  <div class="body">

    <!-- LEFT -->
    <aside class="panel left">
      <div class="sect">
        <h2>Add</h2>
        <div class="stack">
          <button class="tool" data-act="addImage">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M4 17l5-4 4 3 3-2 4 3"/></svg>
            Image layer
          </button>
          <button class="tool" data-act="addOverlay">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="13" height="13" rx="2"/><path d="M8 8h13v13H8z"/></svg>
            Mockup overlay
          </button>
          <button class="tool" data-tool="frameRect">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M3 5l18 14M21 5L3 19" stroke-dasharray="2 2"/></svg>
            Rect frame <span class="k">R</span>
          </button>
          <button class="tool" data-tool="framePersp">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6l16 2v8L4 18z"/><circle cx="4" cy="6" r="1.4" fill="currentColor"/><circle cx="20" cy="8" r="1.4" fill="currentColor"/><circle cx="20" cy="16" r="1.4" fill="currentColor"/><circle cx="4" cy="18" r="1.4" fill="currentColor"/></svg>
            Perspective frame <span class="k">P</span>
          </button>
          <button class="tool" data-tool="text">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 6h14M12 6v13M9 19h6"/></svg>
            Text <span class="k">T</span>
          </button>
          <button class="tool" data-tool="shape">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="9" height="9" rx="1.5"/><circle cx="15.5" cy="15.5" r="4.5"/></svg>
            Shape <span class="k">S</span>
          </button>
        </div>
      </div>

      <div class="sect">
        <h2>Layers <span style="text-transform:none;letter-spacing:0;font-weight:500">(top first)</span></h2>
        <div class="layers" id="layerList"></div>
      </div>

      <div class="sect">
        <h2>Saved mockups</h2>
        <div class="stack" id="tplList"></div>
      </div>
    </aside>

    <!-- STAGE -->
    <main class="stage">
      <div class="stagebar">
        <span class="pill blue" id="modePill">Select</span>
        <span id="stageMsg">Click a frame to select · double-click to edit the image inside</span>
        <div class="spacer"></div>
        <button class="btn sm" id="zoomOut">−</button>
        <span class="val" id="zoomVal" style="min-width:42px;text-align:center">100%</span>
        <button class="btn sm" id="zoomIn">+</button>
        <button class="btn sm" id="zoomFit">Fit</button>
      </div>
      <div class="canvaswrap" id="wrap">
        <div class="board" id="board">
          <canvas id="cv"></canvas>
          <div class="hint" id="hint"></div>
        </div>
      </div>
    </main>

    <!-- RIGHT -->
    <aside class="panel right" id="right"></aside>

  </div>
</div>

<input type="file" id="filePick" accept="image/*" class="hidden" />

   FrameForge — mockup frame studio
   Layer engine + true 4-point perspective warp (homography + triangle mesh)
   ========================================================================= */

/* ---------------------------- state ---------------------------- */
let doc = { canvas: { w: 1200, h: 800, bg: '#FFFFFF' }, layers: [] };
let sel = null;          // selected layer id
let contentEdit = null;  // frame id whose inner image is being edited
let tool = 'select';
let zoom = 1;
let drag = null;

const uid = () => 'l' + Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const $ = (s) => document.querySelector(s);

const cv = $('#cv'), ctx = cv.getContext('2d');
const board = $('#board'), wrap = $('#wrap');

/* ---------------------------- image cache ---------------------------- */
const imgCache = new Map();
function getImg(src) {
  if (!src) return null;
  let e = imgCache.get(src);
  if (!e) {
    e = { img: new Image(), ready: false };
    e.img.onload = () => { e.ready = true; contentCache.clear(); render(); refreshLayers(); };
    e.img.src = src;
    imgCache.set(src, e);
  }
  return e.ready ? e.img : null;
}
function loadMeta(src) {
  return new Promise((res) => {
    const i = new Image();
    i.onload = () => res({ w: i.naturalWidth, h: i.naturalHeight });
    i.src = src;
  });
}
function pickFile(accept) {
  return new Promise((res) => {
    const inp = $('#filePick');
    inp.value = '';
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      if (!f) return res(null);
      const fr = new FileReader();
      fr.onload = () => res({ src: String(fr.result), name: f.name });
      fr.readAsDataURL(f);
    };
    inp.click();
  });
}

/* =========================================================================
   GEOMETRY — homography
   ========================================================================= */
function gauss(A, b) {
  const n = b.length;
  for (let i = 0; i < n; i++) {
    let p = i;
    for (let r = i + 1; r < n; r++) if (Math.abs(A[r][i]) > Math.abs(A[p][i])) p = r;
    [A[i], A[p]] = [A[p], A[i]]; [b[i], b[p]] = [b[p], b[i]];
    const d = A[i][i] || 1e-12;
    for (let r = i + 1; r < n; r++) {
      const f = A[r][i] / d;
      if (!f) continue;
      for (let c = i; c < n; c++) A[r][c] -= f * A[i][c];
      b[r] -= f * b[i];
    }
  }
  const x = new Array(n).fill(0);
  for (let i = n - 1; i >= 0; i--) {
    let s = b[i];
    for (let c = i + 1; c < n; c++) s -= A[i][c] * x[c];
    x[i] = s / (A[i][i] || 1e-12);
  }
  return x;
}
// src quad -> dst quad, 3x3 homography (h8 = 1)
function solveH(src, dst) {
  const A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const { x, y } = src[i], u = dst[i].x, v = dst[i].y;
    A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
    A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v);
  }
  const h = gauss(A, b); h.push(1);
  return h;
}
function applyH(h, x, y) {
  const d = h[6] * x + h[7] * y + h[8] || 1e-12;
  return { x: (h[0] * x + h[1] * y + h[2]) / d, y: (h[3] * x + h[4] * y + h[5]) / d };
}

/* Draw one source triangle into a destination triangle via exact affine map. */
function drawTri(c, img, s0, s1, s2, d0, d1, d2, pad) {
  const v1x = s1.x - s0.x, v1y = s1.y - s0.y, v2x = s2.x - s0.x, v2y = s2.y - s0.y;
  const det = v1x * v2y - v2x * v1y;
  if (!det) return;
  const w1x = d1.x - d0.x, w1y = d1.y - d0.y, w2x = d2.x - d0.x, w2y = d2.y - d0.y;
  const a = (w1x * v2y - w2x * v1y) / det;
  const cc = (-w1x * v2x + w2x * v1x) / det;
  const b = (w1y * v2y - w2y * v1y) / det;
  const d = (-w1y * v2x + w2y * v1x) / det;
  const e = d0.x - a * s0.x - cc * s0.y;
  const f = d0.y - b * s0.x - d * s0.y;

  // expand clip slightly from centroid so adjacent triangles have no hairline seams
  const gx = (d0.x + d1.x + d2.x) / 3, gy = (d0.y + d1.y + d2.y) / 3;
  const out = (p) => {
    const dx = p.x - gx, dy = p.y - gy, L = Math.hypot(dx, dy) || 1;
    return { x: p.x + (dx / L) * pad, y: p.y + (dy / L) * pad };
  };
  const q0 = out(d0), q1 = out(d1), q2 = out(d2);

  c.save();
  c.beginPath();
  c.moveTo(q0.x, q0.y); c.lineTo(q1.x, q1.y); c.lineTo(q2.x, q2.y); c.closePath();
  c.clip();
  c.transform(a, b, cc, d, e, f);
  c.drawImage(img, 0, 0);
  c.restore();
}

/* Warp a source canvas/image into an arbitrary quad using a triangle mesh. */
function warpQuad(c, img, quad, steps, pad) {
  const W = img.width, H = img.height;
  const h = solveH(
    [{ x: 0, y: 0 }, { x: W, y: 0 }, { x: W, y: H }, { x: 0, y: H }],
    quad
  );
  const N = steps, grid = [];
  for (let j = 0; j <= N; j++) {
    const row = [];
    for (let i = 0; i <= N; i++) row.push(applyH(h, (W * i) / N, (H * j) / N));
    grid.push(row);
  }
  for (let j = 0; j < N; j++) {
    for (let i = 0; i < N; i++) {
      const sx0 = (W * i) / N, sx1 = (W * (i + 1)) / N;
      const sy0 = (H * j) / N, sy1 = (H * (j + 1)) / N;
      const s00 = { x: sx0, y: sy0 }, s10 = { x: sx1, y: sy0 },
            s11 = { x: sx1, y: sy1 }, s01 = { x: sx0, y: sy1 };
      const d00 = grid[j][i], d10 = grid[j][i + 1], d11 = grid[j + 1][i + 1], d01 = grid[j + 1][i];
      drawTri(c, img, s00, s10, s11, d00, d10, d11, pad);
      drawTri(c, img, s00, s11, s01, d00, d11, d01, pad);
    }
  }
}

function isAxisRect(p) {
  if (p.length !== 4) return false;
  const t = 0.4;
  return Math.abs(p[0].y - p[1].y) < t && Math.abs(p[2].y - p[3].y) < t &&
         Math.abs(p[0].x - p[3].x) < t && Math.abs(p[1].x - p[2].x) < t &&
         p[1].x > p[0].x && p[3].y > p[0].y;
}
function bbox(p) {
  const xs = p.map(q => q.x), ys = p.map(q => q.y);
  return { x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) };
}
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
// natural content size of a frame quad (average of opposite edge lengths)
function frameSpace(p) {
  if (p.length === 4) {
    return {
      w: Math.max(8, (dist(p[0], p[1]) + dist(p[3], p[2])) / 2),
      h: Math.max(8, (dist(p[0], p[3]) + dist(p[1], p[2])) / 2)
    };
  }
  const b = bbox(p);
  return { w: Math.max(8, b.w), h: Math.max(8, b.h) };
}
function inPoly(pt, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if ((a.y > pt.y) !== (b.y > pt.y) &&
        pt.x < ((b.x - a.x) * (pt.y - a.y)) / (b.y - a.y) + a.x) c = !c;
  }
  return c;
}

/* =========================================================================
   FRAME CONTENT — render inner image into frame-local space, then warp
   ========================================================================= */
const contentCache = new Map();
function frameContentCanvas(L, res) {
  const c0 = L.content;
  if (!c0 || !c0.src) return null;
  const img = getImg(c0.src);
  if (!img) return null;
  const sp = frameSpace(L.points);
  const key = [L.id, c0.src, c0.offsetX, c0.offsetY, c0.scale, c0.rotation, c0.fit,
               Math.round(sp.w), Math.round(sp.h), res].join('|');
  const hit = contentCache.get(key);
  if (hit) return hit;

  const cw = Math.max(2, Math.round(sp.w * res)), ch = Math.max(2, Math.round(sp.h * res));
  const off = document.createElement('canvas');
  off.width = cw; off.height = ch;
  const c = off.getContext('2d');
  c.imageSmoothingQuality = 'high';
  c.save();
  c.scale(res, res);
  const nw = img.naturalWidth, nh = img.naturalHeight;
  const base = c0.fit === 'contain'
    ? Math.min(sp.w / nw, sp.h / nh)
    : Math.max(sp.w / nw, sp.h / nh);
  const s = base * (c0.scale || 1);
  c.translate(sp.w / 2 + (c0.offsetX || 0) * sp.w, sp.h / 2 + (c0.offsetY || 0) * sp.h);
  c.rotate(((c0.rotation || 0) * Math.PI) / 180);
  c.drawImage(img, (-nw * s) / 2, (-nh * s) / 2, nw * s, nh * s);
  c.restore();

  if (contentCache.size > 24) contentCache.clear();
  contentCache.set(key, off);
  return off;
}

/* =========================================================================
   RENDER
   ========================================================================= */
function render(target, opts) {
  const o = Object.assign({ scale: 1, chrome: true, only: null, bg: true, quality: 'preview' }, opts || {});
  const c = target || ctx;
  const W = doc.canvas.w * o.scale, H = doc.canvas.h * o.scale;
  if (!target) { cv.width = W; cv.height = H; applyZoom(); }

  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, W, H);
  if (o.bg && doc.canvas.bg !== 'transparent') { c.fillStyle = doc.canvas.bg; c.fillRect(0, 0, W, H); }
  c.save();
  c.scale(o.scale, o.scale);
  c.imageSmoothingQuality = 'high';

  const steps = o.quality === 'export' ? 28 : (drag ? 10 : 18);
  const res = o.quality === 'export' ? Math.min(3, o.scale * 1.4) : 1;

  for (const L of doc.layers) {
    if (!L.visible) continue;
    if (o.only && !o.only.includes(L.type)) continue;
    c.save();
    c.globalAlpha = L.opacity == null ? 1 : L.opacity;

    if (L.type === 'frame') {
      const cc = frameContentCanvas(L, res);
      if (cc) {
        if (isAxisRect(L.points) && (!L.content.rotation)) {
          const b = bbox(L.points);
          c.save(); c.beginPath();
          c.rect(b.x, b.y, b.w, b.h); c.clip();
          c.drawImage(cc, b.x, b.y, b.w, b.h);
          c.restore();
        } else if (L.points.length === 4) {
          warpQuad(c, cc, L.points, steps, 0.6 / o.scale);
        } else {
          const b = bbox(L.points);
          c.save();
          if(L.publishMode==='silhouette') c.clip(_silhouettePath2D(L));
          else { c.beginPath();c.moveTo(L.points[0].x,L.points[0].y);L.points.slice(1).forEach(p=>c.lineTo(p.x,p.y));c.closePath();c.clip(); }
          c.drawImage(cc, b.x, b.y, b.w, b.h);
          c.restore();
        }
      } else if (o.chrome) {
        // empty frame placeholder (editor only — never exported)
        c.save();
        const silhouettePath=L.publishMode==='silhouette'?_silhouettePath2D(L):null;
        if(!silhouettePath){c.beginPath();c.moveTo(L.points[0].x,L.points[0].y);L.points.slice(1).forEach(p=>c.lineTo(p.x,p.y));c.closePath()}
        c.fillStyle = 'rgba(39,131,222,.14)'; silhouettePath?c.fill(silhouettePath):c.fill();
        c.setLineDash([7, 5]); c.lineWidth = 1.6 / zoom; c.strokeStyle = '#2783DE'; if(!silhouettePath)c.stroke();
        const b = bbox(L.points);
        c.setLineDash([]);
        c.fillStyle = '#2783DE';
        c.font = `600 ${Math.max(11, Math.min(15, b.h / 12))}px -apple-system,Segoe UI,Roboto,sans-serif`;
        c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText('Drop image here', b.x + b.w / 2, b.y + b.h / 2);
        c.restore();
      }
      if(L.detailOverlayDataUrl){const detail=getImg(L.detailOverlayDataUrl);if(detail)c.drawImage(detail,0,0,doc.canvas.w,doc.canvas.h)}
    } else if (L.type === 'image' || L.type === 'overlay') {
      const img = getImg(L.src);
      if (img) {
        c.save();
        c.translate(L.x + L.w / 2, L.y + L.h / 2);
        c.rotate(((L.rotation || 0) * Math.PI) / 180);
        c.drawImage(img, -L.w / 2, -L.h / 2, L.w, L.h);
        c.restore();
      }
    } else if (L.type === 'shape') {
      c.save();
      c.translate(L.x + L.w / 2, L.y + L.h / 2);
      c.rotate(((L.rotation || 0) * Math.PI) / 180);
      c.fillStyle = L.fill;
      if (L.shape === 'ellipse') {
        c.beginPath(); c.ellipse(0, 0, L.w / 2, L.h / 2, 0, 0, Math.PI * 2); c.fill();
      } else {
        const r = Math.min(L.radius || 0, L.w / 2, L.h / 2);
        c.beginPath();
        if (c.roundRect) c.roundRect(-L.w / 2, -L.h / 2, L.w, L.h, r);
        else c.rect(-L.w / 2, -L.h / 2, L.w, L.h);
        c.fill();
      }
      c.restore();
    } else if (L.type === 'text') {
      c.save();
      c.translate(L.x, L.y);
      c.rotate(((L.rotation || 0) * Math.PI) / 180);
      c.fillStyle = L.color;
      c.font = `${L.weight || 600} ${L.size}px ${L.font || '-apple-system,Segoe UI,Roboto,sans-serif'}`;
      c.textAlign = L.align || 'left';
      c.textBaseline = 'top';
      String(L.text).split('\n').forEach((line, i) => c.fillText(line, 0, i * L.size * 1.25));
      c.restore();
    }
    c.restore();
  }

  if (o.chrome) drawChrome(c);
  c.restore();
}

function drawChrome(c) {
  const L = layer(sel);
  if (!L) return;
  const active = contentEdit === L.id;
  c.save();
  c.lineWidth = 1.6 / zoom;
  c.strokeStyle = active ? '#D5803B' : '#2783DE';

  if (L.type === 'frame') {
    if(L.publishMode==='silhouette'){/* Internal one-M bridges are fill-only; never stroke them. */}
    else {c.beginPath();c.moveTo(L.points[0].x,L.points[0].y);L.points.slice(1).forEach(p=>c.lineTo(p.x,p.y));c.closePath();c.stroke()}
    if (!L.locked && L.publishMode!=='silhouette') {
      const r = 6 / zoom;
      L.points.forEach((p) => {
        c.beginPath(); c.rect(p.x - r, p.y - r, r * 2, r * 2);
        c.fillStyle = '#fff'; c.fill();
        c.lineWidth = 2 / zoom; c.strokeStyle = active ? '#D5803B' : '#2783DE'; c.stroke();
      });
    }
  } else {
    const b = L.type === 'text'
      ? { x: L.x - 4, y: L.y - 4, w: textW(c, L) + 8, h: L.size * 1.25 * String(L.text).split('\n').length + 8 }
      : { x: L.x, y: L.y, w: L.w, h: L.h };
    c.strokeRect(b.x, b.y, b.w, b.h);
  }
  c.restore();
}
function textW(c, L) {
  c.save();
  c.font = `${L.weight || 600} ${L.size}px ${L.font || 'sans-serif'}`;
  const w = Math.max(...String(L.text).split('\n').map(s => c.measureText(s).width));
  c.restore();
  return w;
}
const layer = (id) => doc.layers.find(l => l.id === id) || null;

/* =========================================================================
   LAYER FACTORIES
   ========================================================================= */
function newFrame(kind, x, y, w, h) {
  const pts = kind === 'persp'
    ? [{ x: x + w * 0.06, y: y + h * 0.04 }, { x: x + w, y }, { x: x + w * 0.97, y: y + h }, { x, y: y + h * 0.94 }]
    : [{ x, y }, { x: x + w, y }, { x: x + w, y: y + h }, { x, y: y + h }];
  return {
    id: uid(), type: 'frame', name: kind === 'persp' ? 'Perspective Frame' : 'Screen Frame',
    frameType: kind === 'persp' ? 'perspective' : 'rect',
    visible: true, locked: false, opacity: 1, points: pts,
    content: null
  };
}
const emptyContent = (src) => ({ src, offsetX: 0, offsetY: 0, scale: 1, rotation: 0, fit: 'cover' });

function addLayerTop(L) { doc.layers.push(L); sel = L.id; sync(); }

/* =========================================================================
   POINTER INTERACTION
   ========================================================================= */
function toScene(ev) {
  const r = cv.getBoundingClientRect();
  return { x: ((ev.clientX - r.left) / r.width) * doc.canvas.w, y: ((ev.clientY - r.top) / r.height) * doc.canvas.h };
}
function hitLayer(p) {
  for (let i = doc.layers.length - 1; i >= 0; i--) {
    const L = doc.layers[i];
    if (!L.visible || L.locked) continue;
    if (L.type === 'frame') { if (inPoly(p, L.points)) return L; }
    else if (L.type === 'text') {
      const w = textW(ctx, L), h = L.size * 1.25 * String(L.text).split('\n').length;
      if (p.x >= L.x - 4 && p.x <= L.x + w + 4 && p.y >= L.y - 4 && p.y <= L.y + h + 4) return L;
    } else if (p.x >= L.x && p.x <= L.x + L.w && p.y >= L.y && p.y <= L.y + L.h) return L;
  }
  return null;
}
function hitCorner(p, L) {
  if (!L || L.type !== 'frame' || L.locked || L.publishMode==='silhouette') return -1;
  const r = 9 / zoom;
  for (let i = 0; i < L.points.length; i++) if (dist(p, L.points[i]) <= r) return i;
  return -1;
}

cv.addEventListener('pointerdown', (ev) => {
  cv.setPointerCapture(ev.pointerId);
  const p = toScene(ev);

  if (tool === 'frameRect' || tool === 'framePersp') {
    drag = { mode: 'create', kind: tool === 'framePersp' ? 'persp' : 'rect', start: p, cur: p };
    return;
  }
  if (tool === 'text') {
    addLayerTop({ id: uid(), type: 'text', name: 'Text', visible: true, locked: false, opacity: 1,
      text: 'Your text', x: p.x, y: p.y, size: 44, color: '#2C2C2B', weight: 700, align: 'left', rotation: 0 });
    setTool('select'); return;
  }
  if (tool === 'shape') {
    addLayerTop({ id: uid(), type: 'shape', name: 'Shape', visible: true, locked: false, opacity: 1,
      shape: 'rect', x: p.x - 100, y: p.y - 70, w: 200, h: 140, fill: '#E5F2FC', radius: 12, rotation: 0 });
    setTool('select'); return;
  }

  const cur = layer(sel);
  const ci = hitCorner(p, cur);
  if (ci >= 0) { drag = { mode: 'corner', id: cur.id, i: ci }; toast('Drag corner · Shift = constrain'); return; }

  const L = hitLayer(p);
  if (!L) { sel = null; contentEdit = null; sync(); return; }

  if (contentEdit === L.id && L.type === 'frame' && L.content) {
    drag = { mode: 'pan', id: L.id, start: p, o: { x: L.content.offsetX, y: L.content.offsetY } };
  } else {
    sel = L.id;
    if (contentEdit && contentEdit !== L.id) contentEdit = null;
    drag = { mode: 'move', id: L.id, start: p, snap: snapshot(L) };
  }
  sync();
});

function snapshot(L) {
  return L.type === 'frame' ? { points: L.points.map(q => ({ ...q })) } : { x: L.x, y: L.y };
}

cv.addEventListener('pointermove', (ev) => {
  if (!drag) {
    const p = toScene(ev);
    const cur = layer(sel);
    cv.style.cursor = hitCorner(p, cur) >= 0 ? 'grab'
      : (contentEdit && cur && inPoly(p, cur.points) ? 'move' : (hitLayer(p) ? 'pointer' : 'default'));
    return;
  }
  const p = toScene(ev);

  if (drag.mode === 'create') { drag.cur = p; render(); previewCreate(); return; }

  const L = layer(drag.id);
  if (!L) return;

  if (drag.mode === 'corner') {
    let q = p;
    if (ev.shiftKey) {
      const o = L.points[(drag.i + 2) % 4];
      q = Math.abs(p.x - o.x) > Math.abs(p.y - o.y) ? { x: p.x, y: L.points[drag.i].y } : { x: L.points[drag.i].x, y: p.y };
    }
    L.points[drag.i] = { x: Math.round(q.x), y: Math.round(q.y) };
    L.frameType = isAxisRect(L.points) ? 'rect' : (L.points.length > 4 ? 'polygon' : 'perspective');
    contentCache.clear();
  } else if (drag.mode === 'move') {
    const dx = p.x - drag.start.x, dy = p.y - drag.start.y;
    if (L.type === 'frame') {
      L.points = drag.snap.points.map(q => ({ x: Math.round(q.x + dx), y: Math.round(q.y + dy) }));
    } else { L.x = Math.round(drag.snap.x + dx); L.y = Math.round(drag.snap.y + dy); }
  } else if (drag.mode === 'pan') {
    const sp = frameSpace(L.points);
    L.content.offsetX = drag.o.x + (p.x - drag.start.x) / sp.w;
    L.content.offsetY = drag.o.y + (p.y - drag.start.y) / sp.h;
  }
  render(); refreshProps();
});

cv.addEventListener('pointerup', (ev) => {
  if (drag && drag.mode === 'create') {
    const a = drag.start, b = drag.cur;
    const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
    const w = Math.abs(b.x - a.x), h = Math.abs(b.y - a.y);
    drag = null;
    if (w > 14 && h > 14) {
      addLayerTop(newFrame(drag2kind, Math.round(x), Math.round(y), Math.round(w), Math.round(h)));
      toast('Frame created · set an image in the right panel');
    }
    setTool('select'); return;
  }
  drag = null; sync();
});

let drag2kind = 'rect';
cv.addEventListener('dblclick', (ev) => {
  const L = hitLayer(toScene(ev));
  if (L && L.type === 'frame' && L.content) {
    sel = L.id; contentEdit = L.id;
    toast('Content mode · drag to move, scroll to zoom');
  } else if (L && L.type === 'frame') {
    sel = L.id; setImageFor(L);
  }
  sync();
});
cv.addEventListener('wheel', (ev) => {
  const L = layer(contentEdit);
  if (!L || !L.content) return;
  ev.preventDefault();
  L.content.scale = clamp(L.content.scale * (ev.deltaY < 0 ? 1.06 : 1 / 1.06), 0.05, 14);
  render(); refreshProps();
}, { passive: false });

function previewCreate() {
  const a = drag.start, b = drag.cur;
  ctx.save();
  ctx.scale(zoom, zoom);
  ctx.setLineDash([6, 4]); ctx.lineWidth = 1.6 / zoom; ctx.strokeStyle = '#2783DE';
  ctx.fillStyle = 'rgba(39,131,222,.08)';
  const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y), w = Math.abs(b.x - a.x), h = Math.abs(b.y - a.y);
  ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h);
  ctx.restore();
}

/* keyboard */
document.addEventListener('keydown', (ev) => {
  if (/input|textarea|select/i.test(ev.target.tagName)) return;
  const L = layer(sel);
  if (ev.key === 'r' || ev.key === 'R') setTool('frameRect');
  else if (ev.key === 'p' || ev.key === 'P') setTool('framePersp');
  else if (ev.key === 't' || ev.key === 'T') setTool('text');
  else if (ev.key === 's' || ev.key === 'S') setTool('shape');
  else if (ev.key === 'Escape') { setTool('select'); contentEdit = null; sel = null; sync(); }
  else if ((ev.key === 'Delete' || ev.key === 'Backspace') && L && !L.locked) { removeLayer(L.id); }
  else if (ev.key.startsWith('Arrow') && L && !L.locked) {
    ev.preventDefault();
    const d = ev.shiftKey ? 10 : 1;
    const dx = ev.key === 'ArrowLeft' ? -d : ev.key === 'ArrowRight' ? d : 0;
    const dy = ev.key === 'ArrowUp' ? -d : ev.key === 'ArrowDown' ? d : 0;
    if (L.type === 'frame') L.points = L.points.map(q => ({ x: q.x + dx, y: q.y + dy }));
    else { L.x += dx; L.y += dy; }
    render(); refreshProps();
  }
});

/* =========================================================================
   UI
   ========================================================================= */
function setTool(t) {
  tool = t;
  if (t === 'framePersp') drag2kind = 'persp';
  if (t === 'frameRect') drag2kind = 'rect';
  document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
  const names = { select: 'Select', frameRect: 'Rect frame', framePersp: 'Perspective frame', text: 'Text', shape: 'Shape' };
  $('#modePill').textContent = names[t] || 'Select';
  $('#stageMsg').textContent = t === 'select'
    ? 'Click a frame to select · double-click to edit the image inside'
    : (t === 'text' || t === 'shape' ? 'Click on the canvas to place it' : 'Drag on the canvas to draw the frame');
  cv.style.cursor = t === 'select' ? 'default' : 'crosshair';
}
let toastT;
function toast(msg) {
  const h = $('#hint'); h.textContent = msg; h.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => h.classList.remove('show'), 2200);
}
function sync() { render(); refreshLayers(); refreshProps(); }

const TYPE_LABEL = { frame: 'Frame', image: 'Image', overlay: 'Overlay (locked on top)', text: 'Text', shape: 'Shape' };

function refreshLayers() {
  const box = $('#layerList');
  box.innerHTML = '';
  if (!doc.layers.length) { box.innerHTML = '<div class="empty">No layers yet. Add a mockup overlay, then draw a frame on it.</div>'; return; }
  [...doc.layers].reverse().forEach((L) => {
    const el = document.createElement('div');
    el.className = 'layer' + (L.id === sel ? ' on' : '') + (L.visible ? '' : ' dim');
    const src = L.type === 'frame' ? (L.content && L.content.src) : L.src;
    const sub = L.type === 'frame'
      ? (L.frameType === 'rect' ? 'Rect frame' : L.frameType === 'perspective' ? '4-point perspective' : 'Polygon frame') +
        (L.content ? '' : ' · empty')
      : TYPE_LABEL[L.type];
    el.innerHTML = `
      <div class="thumb" ${src ? `style="background-image:url(${src})"` : ''}>${src ? '' :
        (L.type === 'frame' ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7D7A75" stroke-width="2"><rect x="3" y="5" width="18" height="14"/></svg>' :
         L.type === 'text' ? '<b style="font-size:13px">T</b>' : '<span style="width:12px;height:12px;border-radius:3px;background:' + (L.fill || '#E6E5E3') + '"></span>')}</div>
      <div class="meta"><div class="nm">${esc(L.name)}</div><div class="ty">${sub}</div></div>
      <button class="iconbtn ${L.visible ? '' : 'act'}" data-vis="${L.id}" title="Show / hide">
        ${L.visible
          ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg>'
          : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 3l18 18M10.6 6.1A10 10 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3 3.6M6.2 8.3C4 10 2 12 2 12s3.6 6.5 10 6.5c1 0 2-.2 2.8-.4"/></svg>'}
      </button>
      <button class="iconbtn ${L.locked ? 'act' : ''}" data-lock="${L.id}" title="Lock / unlock">
        ${L.locked
          ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>'
          : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 7.5-2"/></svg>'}
      </button>`;
    el.addEventListener('click', (e) => {
      const v = e.target.closest('[data-vis]'), k = e.target.closest('[data-lock]');
      if (v) { L.visible = !L.visible; sync(); return; }
      if (k) { L.locked = !L.locked; if (L.locked && sel === L.id) contentEdit = null; sync(); return; }
      sel = L.id; contentEdit = null; sync();
    });
    box.appendChild(el);
  });
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function moveLayer(id, dir) {
  const i = doc.layers.findIndex(l => l.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= doc.layers.length) return;
  [doc.layers[i], doc.layers[j]] = [doc.layers[j], doc.layers[i]];
  sync();
}
function removeLayer(id) {
  doc.layers = doc.layers.filter(l => l.id !== id);
  if (sel === id) sel = null;
  if (contentEdit === id) contentEdit = null;
  sync();
}
async function setImageFor(L) {
  const f = await pickFile();
  if (!f) return;
  L.content = emptyContent(f.src);
  contentCache.clear();
  sel = L.id; contentEdit = L.id;
  toast('Image placed · drag to move, scroll to zoom');
  sync();
}

/* ---------------------------- properties ---------------------------- */

        <div class="stack">
          <div class="row">
            <div class="field"><label>Width</label><input class="inp" type="number" id="cw" value="${doc.canvas.w}"></div>

          <div class="field"><label>Background</label><input type="color" id="cbg" value="${doc.canvas.bg === 'transparent' ? '#ffffff' : doc.canvas.bg}"></div>

    $('#cbgT').onclick = () => { doc.canvas.bg = 'transparent'; render(); toast('Background is now transparent'); };
    return;
  }

  const i = doc.layers.findIndex(l => l.id === L.id);
  let html = `
    <div class="sect">
      <h2>${TYPE_LABEL[L.type]}</h2>
      <div class="stack">
        <div class="field"><label>Name</label><input class="inp" id="pname" value="${esc(L.name)}"></div>
        <div class="row">
          <button class="btn sm" id="up" ${i === doc.layers.length - 1 ? 'disabled' : ''}>↑ Forward</button>

        </div>
        <div class="row">
          <button class="btn sm" id="tvis">${L.visible ? 'Hide' : 'Show'}</button>

          <button class="btn sm danger" id="del">Delete</button>
        </div>
        <div class="field"><label>Opacity <span class="val" id="opv">${Math.round((L.opacity ?? 1) * 100)}%</span></label>
          <input type="range" id="op" min="0" max="100" value="${Math.round((L.opacity ?? 1) * 100)}"></div>
      </div>
    </div>`;

  if (L.type === 'frame') {
    const c0 = L.content;
    html += `
    <div class="sect">
      <h2>Frame</h2>
      <div class="stack">
        <div class="row">
          <button class="chip ${L.frameType === 'rect' ? 'on' : ''}" id="fRect">Rectangle</button>
          <button class="chip ${L.frameType === 'perspective' ? 'on' : ''}" id="fPersp">Perspective</button>
        </div>
        <div class="note">Drag the 4 corner handles on the canvas. The image is warped with a real homography transform — not a stretched rectangle.</div>
        <div class="row"><button class="btn sm" id="addPt">+ Add point</button><button class="btn sm" id="resetQuad">Reset to rect</button></div>
        <div>${L.points.map((p, n) => `<div class="kv"><span>P${n + 1}</span><b>${Math.round(p.x)}, ${Math.round(p.y)}</b></div>`).join('')}</div>
      </div>
    </div>
    <div class="sect">
      <h2>Image inside frame</h2>
      <div class="stack">
        <div class="row">
          <button class="btn sm primary" id="setImg">${c0 ? 'Replace image' : 'Set image'}</button>
          ${c0 ? '<button class="btn sm" id="clrImg">Remove</button>' : ''}
        </div>`;
    if (c0) {
      html += `
        <div class="row">
          <button class="chip ${contentEdit === L.id ? 'on' : ''}" id="ce">${contentEdit === L.id ? 'Content mode: ON' : 'Edit content'}</button>
          <button class="chip ${c0.fit === 'cover' ? 'on' : ''}" id="fit">${c0.fit === 'cover' ? 'Cover' : 'Contain'}</button>
        </div>
        <div class="field"><label>Zoom <span class="val">${c0.scale.toFixed(2)}×</span></label>
          <input type="range" id="cscale" min="5" max="600" value="${Math.round(c0.scale * 100)}"></div>
        <div class="field"><label>Rotate <span class="val">${c0.rotation}°</span></label>
          <input type="range" id="crot" min="-180" max="180" value="${c0.rotation}"></div>
        <div class="row">
          <div class="field"><label>Offset X</label><input class="inp" type="number" step="0.01" id="cox" value="${c0.offsetX.toFixed(2)}"></div>
          <div class="field"><label>Offset Y</label><input class="inp" type="number" step="0.01" id="coy" value="${c0.offsetY.toFixed(2)}"></div>
        </div>
        <button class="btn sm" id="cctr">Center &amp; fit</button>`;
    } else {
      html += `<div class="note">This frame is empty. Empty frames are shown as a dashed placeholder in the editor and are skipped on export — so a saved mockup stays reusable.</div>`;
    }
    html += `</div></div>`;
  } else if (L.type === 'image' || L.type === 'overlay') {
    html += `
    <div class="sect">
      <h2>Transform</h2>
      <div class="stack">
        <div class="row">
          <div class="field"><label>X</label><input class="inp" type="number" id="lx" value="${Math.round(L.x)}"></div>
          <div class="field"><label>Y</label><input class="inp" type="number" id="ly" value="${Math.round(L.y)}"></div>
        </div>
        <div class="row">
          <div class="field"><label>Width</label><input class="inp" type="number" id="lw" value="${Math.round(L.w)}"></div>
          <div class="field"><label>Height</label><input class="inp" type="number" id="lh" value="${Math.round(L.h)}"></div>
        </div>
        <div class="field"><label>Rotate <span class="val">${L.rotation || 0}°</span></label>
          <input type="range" id="lrot" min="-180" max="180" value="${L.rotation || 0}"></div>
        <div class="row"><button class="btn sm" id="lfill">Fit canvas</button><button class="btn sm" id="lreplace">Replace</button></div>
        ${L.type === 'overlay' ? '<div class="note">Keep overlays at the top of the layer list and locked, so the mockup body always covers the artwork.</div>' : ''}
      </div>
    </div>`;
  } else if (L.type === 'text') {
    html += `
    <div class="sect">
      <h2>Text</h2>
      <div class="stack">
        <div class="field"><label>Content</label><textarea class="inp" id="ttxt" rows="3">${esc(L.text)}</textarea></div>

          <div class="field"><label>Size</label><input class="inp" type="number" id="tsize" value="${L.size}"></div>
          <div class="field"><label>Weight</label>
            <select class="inp" id="tw">${[400, 500, 600, 700, 800].map(w => `<option ${L.weight == w ? 'selected' : ''}>${w}</option>`).join('')}</select>
          </div>
        </div>
        <div class="field"><label>Color</label><input type="color" id="tcol" value="${L.color}"></div>
        <div class="field"><label>Rotate <span class="val">${L.rotation || 0}°</span></label>
          <input type="range" id="trot" min="-180" max="180" value="${L.rotation || 0}"></div>
      </div>
    </div>`;
  } else if (L.type === 'shape') {
    html += `
    <div class="sect">
      <h2>Shape</h2>
      <div class="stack">
        <div class="row">
          <button class="chip ${L.shape === 'rect' ? 'on' : ''}" id="shR">Rect</button>
          <button class="chip ${L.shape === 'ellipse' ? 'on' : ''}" id="shE">Ellipse</button>
        </div>
        <div class="field"><label>Fill</label><input type="color" id="sfill" value="${L.fill}"></div>
        <div class="row">
          <div class="field"><label>Width</label><input class="inp" type="number" id="lw" value="${Math.round(L.w)}"></div>
          <div class="field"><label>Height</label><input class="inp" type="number" id="lh" value="${Math.round(L.h)}"></div>
        </div>
        <div class="field"><label>Corner radius <span class="val">${L.radius || 0}px</span></label>
          <input type="range" id="srad" min="0" max="120" value="${L.radius || 0}"></div>
      </div>
    </div>`;
  }
  box.innerHTML = html;
  bindProps(L);
}

function bindProps(L) {
  const on = (s, ev, fn) => { const el = $(s); if (el) el.addEventListener(ev, fn); };
  on('#pname', 'input', e => { L.name = e.target.value; refreshLayers(); });
  on('#up', 'click', () => moveLayer(L.id, 1));
  on('#down', 'click', () => moveLayer(L.id, -1));
  on('#tvis', 'click', () => { L.visible = !L.visible; sync(); });
  on('#tlock', 'click', () => { L.locked = !L.locked; sync(); });
  on('#del', 'click', () => removeLayer(L.id));
  on('#op', 'input', e => { L.opacity = +e.target.value / 100; $('#opv').textContent = e.target.value + '%'; render(); });

  // frame
  on('#fRect', 'click', () => { const b = bbox(L.points); L.points = [{ x: b.x, y: b.y }, { x: b.x + b.w, y: b.y }, { x: b.x + b.w, y: b.y + b.h }, { x: b.x, y: b.y + b.h }]; L.frameType = 'rect'; contentCache.clear(); sync(); });
  on('#resetQuad', 'click', () => { const b = bbox(L.points); L.points = [{ x: b.x, y: b.y }, { x: b.x + b.w, y: b.y }, { x: b.x + b.w, y: b.y + b.h }, { x: b.x, y: b.y + b.h }]; L.frameType = 'rect'; contentCache.clear(); sync(); });
  on('#fPersp', 'click', () => {
    const b = bbox(L.points);
    L.points = [{ x: b.x + b.w * 0.06, y: b.y + b.h * 0.04 }, { x: b.x + b.w, y: b.y }, { x: b.x + b.w * 0.97, y: b.y + b.h }, { x: b.x, y: b.y + b.h * 0.94 }];
    L.frameType = 'perspective'; contentCache.clear(); sync();
  });
  on('#addPt', 'click', () => {
    const p = L.points, n = p.length;
    const mid = { x: (p[n - 1].x + p[0].x) / 2, y: (p[n - 1].y + p[0].y) / 2 };
    L.points = [...p, mid]; L.frameType = 'polygon'; contentCache.clear(); sync();
  });
  on('#setImg', 'click', () => setImageFor(L));
  on('#clrImg', 'click', () => { L.content = null; contentEdit = null; contentCache.clear(); sync(); });
  on('#ce', 'click', () => { contentEdit = contentEdit === L.id ? null : L.id; sync(); });
  on('#fit', 'click', () => { L.content.fit = L.content.fit === 'cover' ? 'contain' : 'cover'; contentCache.clear(); sync(); });
  on('#cscale', 'input', e => { L.content.scale = +e.target.value / 100; contentCache.clear(); render(); });
  on('#cscale', 'change', refreshProps);
  on('#crot', 'input', e => { L.content.rotation = +e.target.value; contentCache.clear(); render(); });
  on('#crot', 'change', refreshProps);
  on('#cox', 'change', e => { L.content.offsetX = +e.target.value || 0; contentCache.clear(); render(); });
  on('#coy', 'change', e => { L.content.offsetY = +e.target.value || 0; contentCache.clear(); render(); });
  on('#cctr', 'click', () => { Object.assign(L.content, { offsetX: 0, offsetY: 0, scale: 1, rotation: 0 }); contentCache.clear(); sync(); });

  // image / overlay / shape
  on('#lx', 'change', e => { L.x = +e.target.value; render(); });
  on('#ly', 'change', e => { L.y = +e.target.value; render(); });
  on('#lw', 'change', e => { L.w = +e.target.value; render(); });
  on('#lh', 'change', e => { L.h = +e.target.value; render(); });
  on('#lrot', 'input', e => { L.rotation = +e.target.value; render(); });
  on('#lrot', 'change', refreshProps);
  on('#lfill', 'click', async () => {
    const m = await loadMeta(L.src);
    const s = Math.min(doc.canvas.w / m.w, doc.canvas.h / m.h);
    L.w = m.w * s; L.h = m.h * s; L.x = (doc.canvas.w - L.w) / 2; L.y = (doc.canvas.h - L.h) / 2;
    sync();
  });
  on('#lreplace', 'click', async () => {
    const f = await pickFile(); if (!f) return;
    L.src = f.src; const m = await loadMeta(f.src);
    const s = Math.min(doc.canvas.w / m.w, doc.canvas.h / m.h);
    L.w = m.w * s; L.h = m.h * s; sync();
  });

  // text
  on('#ttxt', 'input', e => { L.text = e.target.value; render(); });
  on('#tsize', 'change', e => { L.size = +e.target.value || 24; render(); });
  on('#tw', 'change', e => { L.weight = +e.target.value; render(); });
  on('#tcol', 'input', e => { L.color = e.target.value; render(); });
  on('#trot', 'input', e => { L.rotation = +e.target.value; render(); });

  // shape
  on('#shR', 'click', () => { L.shape = 'rect'; sync(); });
  on('#shE', 'click', () => { L.shape = 'ellipse'; sync(); });
  on('#sfill', 'input', e => { L.fill = e.target.value; render(); refreshLayers(); });
  on('#srad', 'input', e => { L.radius = +e.target.value; render(); });
}

/* =========================================================================
   ADD / FILE ACTIONS
   ========================================================================= */
document.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => actions[b.dataset.act]()));

const actions = {
  async addImage() {
    const f = await pickFile(); if (!f) return;
    const m = await loadMeta(f.src);
    const s = Math.min(doc.canvas.w / m.w, doc.canvas.h / m.h, 1);
    addLayerTop({ id: uid(), type: 'image', name: f.name.replace(/\.[^.]+$/, '') || 'Image', visible: true, locked: false, opacity: 1,
      src: f.src, x: (doc.canvas.w - m.w * s) / 2, y: (doc.canvas.h - m.h * s) / 2, w: m.w * s, h: m.h * s, rotation: 0 });
  },
  async addOverlay() {
    const f = await pickFile(); if (!f) return;
    const m = await loadMeta(f.src);
    const s = Math.min(doc.canvas.w / m.w, doc.canvas.h / m.h);
    addLayerTop({ id: uid(), type: 'overlay', name: f.name.replace(/\.[^.]+$/, '') || 'Mockup overlay', visible: true, locked: true, opacity: 1,
      src: f.src, x: (doc.canvas.w - m.w * s) / 2, y: (doc.canvas.h - m.h * s) / 2, w: m.w * s, h: m.h * s, rotation: 0 });
    toast('Overlay added and locked on top');
  }
};

function sizePill() { $('#sizePill').textContent = `${doc.canvas.w} × ${doc.canvas.h}`; }

function download(blobOrUrl, name) {
  const a = document.createElement('a');
  a.download = name;
  a.href = typeof blobOrUrl === 'string' ? blobOrUrl : URL.createObjectURL(blobOrUrl);
  a.click();
  if (typeof blobOrUrl !== 'string') setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function exportCanvas(opts) {
  const scale = opts.scale || 2;
  const off = document.createElement('canvas');
  off.width = Math.round(doc.canvas.w * scale);
  off.height = Math.round(doc.canvas.h * scale);
  const c = off.getContext('2d');
  contentCache.clear();
  render(c, { scale, chrome: false, quality: 'export', only: opts.only || null, bg: opts.bg !== false });
  contentCache.clear();
  render();

/* Tighten the document around visible overlay pixels and frame geometry. */
$('#btnFitCanvas').onclick = () => {
  const overlays = doc.layers.filter(l => l.visible && l.type === 'overlay');
  const frames = doc.layers.filter(l => l.visible && l.type === 'frame');
  if (!overlays.length) { toast('Add a transparent mockup overlay first'); return; }

  const raw = prompt('Padding around mockup (canvas pixels)', '20');
  if (raw == null) return;
  const pad = Math.max(0, Math.min(300, parseFloat(raw) || 0));

  const off = exportCanvas({ scale: 1, only: ['overlay'], bg: false });
  const pixels = off.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, off.width, off.height).data;
  let minX = off.width, minY = off.height, maxX = -1, maxY = -1;
  for (let y = 0; y < off.height; y++) {
    for (let x = 0; x < off.width; x++) {
      if (pixels[(y * off.width + x) * 4 + 3] > 3) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  frames.forEach(f => f.points.forEach(p => {
    minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
    minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
  }));
  if (maxX < minX || maxY < minY) { toast('No visible mockup pixels found'); return; }

  const x0 = Math.max(0, Math.floor(minX - pad));
  const y0 = Math.max(0, Math.floor(minY - pad));
  const x1 = Math.min(doc.canvas.w, Math.ceil(maxX + 1 + pad));
  const y1 = Math.min(doc.canvas.h, Math.ceil(maxY + 1 + pad));
  const newW = Math.max(8, x1 - x0), newH = Math.max(8, y1 - y0);
  if (newW === doc.canvas.w && newH === doc.canvas.h && x0 === 0 && y0 === 0) {
    toast('Canvas is already fitted'); return;
  }

  doc.layers.forEach(l => {
    if (l.type === 'frame') l.points.forEach(p => { p.x -= x0; p.y -= y0; });
    else { if (typeof l.x === 'number') l.x -= x0; if (typeof l.y === 'number') l.y -= y0; }
  });
  doc.canvas.w = newW;
  doc.canvas.h = newH;
  contentCache.clear();
  sizePill();
  fit();
  sync();
  toast(`Canvas fitted to ${newW} × ${newH} with ${pad}px padding`);
};

function polygonSignedArea(points) {
  let area = 0;
  for (let i = 0; i < points.length; i++) {
    const a = points[i], b = points[(i + 1) % points.length];
    area += a.x * b.y - b.x * a.y;

/* Constant-distance polygon expansion. The Canva image extends beneath the
   opaque overlay, hiding antialiasing gaps without changing the artwork. */
function makeOverlayAlphaMap(canvas = null) {
  try {
    const c = canvas || exportCanvas({ scale: 1, only: ['overlay'], bg: false });
    const ctx = c.getContext('2d', { willReadFrequently: true });
    return {
      data: ctx.getImageData(0, 0, c.width, c.height).data,
      w: c.width,
      h: c.height,
      sx: c.width / doc.canvas.w,
      sy: c.height / doc.canvas.h
    };
  } catch (error) {
    console.warn('Auto-safe bleed could not inspect overlay alpha', error);
    return null;
  }
}

function overlayAlphaAt(map, x, y) {
  if (!map) return 0;
  const cx = Math.round(x * map.sx), cy = Math.round(y * map.sy);
  const rx = Math.max(1, Math.round(map.sx)), ry = Math.max(1, Math.round(map.sy));
  let total = 0, count = 0;
  for (let yy = cy - ry; yy <= cy + ry; yy++) {
    for (let xx = cx - rx; xx <= cx + rx; xx++) {
      if (xx < 0 || yy < 0 || xx >= map.w || yy >= map.h) continue;
      total += map.data[(yy * map.w + xx) * 4 + 3];
      count++;
    }
  }
  return count ? total / count : 0;
}

  if (!points || points.length < 3 || !(bleed > 0)) return (points || []).map(p => ({ x: p.x, y: p.y }));
  const orientation = polygonSignedArea(points) >= 0 ? 1 : -1;
  const normal = (a, b) => {
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy) || 1;
    return orientation > 0 ? { x: dy / len, y: -dx / len } : { x: -dy / len, y: dx / len };
  };
  const out = [];
  for (let i = 0; i < points.length; i++) {
    const p0 = points[(i - 1 + points.length) % points.length];
    const p1 = points[i];
    const p2 = points[(i + 1) % points.length];

    const targetDistance = Math.min(bleed / dot, bleed * 2.8);
    let distance = alphaMap ? targetDistance : 0;

       Once an opaque border is found, stop before its outer transparent edge.

/* =====================================================================
   CANVA FRAME PDF — replaces the whole Photopea route
   (Select Pixels -> Selection to Path -> Vector Mask -> Export PDF)

   We read the alpha channel, trace real vector contours (marching
   squares + Douglas-Peucker), and write a PDF where the bitmap is
   clipped by those contours. Canva reads that clip as a vector shape,
   so "Detach image" + delete image leaves a native Canva frame.
   ===================================================================== */

let pdfBundle = [];   // queued pages for a multi-frame PDF

function loadImg(src) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('image failed'));
    i.src = src;
  });
}

/* ---------------------- marching-squares alpha tracer ---------------------- */
function traceAlpha(img, threshold, maxSide) {
  const nw = img.naturalWidth || img.width, nh = img.naturalHeight || img.height;
  const k = Math.min(1, maxSide / Math.max(nw, nh));
  const w = Math.max(2, Math.round(nw * k)), h = Math.max(2, Math.round(nh * k));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.drawImage(img, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data;
  const v = (i, j) => (i < 0 || j < 0 || i >= w || j >= h) ? 0 : (d[(j * w + i) * 4 + 3] > threshold ? 1 : 0);

  const segs = [];
  for (let j = -1; j < h; j++) {
    for (let i = -1; i < w; i++) {
      const a = v(i, j), b = v(i + 1, j), cc = v(i + 1, j + 1), dd = v(i, j + 1);
      const code = a | (b << 1) | (cc << 2) | (dd << 3);
      if (code === 0 || code === 15) continue;
      const T = [i + 0.5, j], R = [i + 1, j + 0.5], B = [i + 0.5, j + 1], L = [i, j + 0.5];
      switch (code) {
        case 1: segs.push([L, T]); break;
        case 2: segs.push([T, R]); break;
        case 3: segs.push([L, R]); break;
        case 4: segs.push([R, B]); break;
        case 5: segs.push([L, T], [R, B]); break;
        case 6: segs.push([T, B]); break;
        case 7: segs.push([L, B]); break;
        case 8: segs.push([B, L]); break;
        case 9: segs.push([B, T]); break;
        case 10: segs.push([T, R], [B, L]); break;
        case 11: segs.push([B, R]); break;
        case 12: segs.push([R, L]); break;
        case 13: segs.push([R, T]); break;
        case 14: segs.push([T, L]); break;
      }
    }
  }
  if (!segs.length) return { loops: [], scale: 1 / k };

  /* link segments into closed loops */
  const key = p => p[0].toFixed(1) + ':' + p[1].toFixed(1);
  const from = new Map();
  segs.forEach((s, idx) => {
    const kk = key(s[0]);
    if (!from.has(kk)) from.set(kk, []);
    from.get(kk).push(idx);
  });
  const used = new Array(segs.length).fill(false);
  const loops = [];
  for (let i = 0; i < segs.length; i++) {
    if (used[i]) continue;
    const loop = [segs[i][0]];
    let cur = i;
    used[i] = true;
    for (let guard = 0; guard < 400000; guard++) {
      const end = segs[cur][1];
      loop.push(end);
      const cand = (from.get(key(end)) || []).find(ix => !used[ix]);
      if (cand === undefined) break;
      used[cand] = true;
      cur = cand;
    }
    if (loop.length > 8) loops.push(loop);
  }
  return { loops, scale: 1 / k };
}

/* ---------------------- Douglas-Peucker simplify ---------------------- */
function simplify(pts, eps) {
  if (pts.length < 4) return pts;
  const d2 = (p, a, b) => {
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const L = dx * dx + dy * dy;
    if (!L) return (p[0] - a[0]) ** 2 + (p[1] - a[1]) ** 2;
    let t = ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L;
    t = Math.max(0, Math.min(1, t));
    return (p[0] - (a[0] + t * dx)) ** 2 + (p[1] - (a[1] + t * dy)) ** 2;
  };
  const keep = new Array(pts.length).fill(false);
  keep[0] = keep[pts.length - 1] = true;
  const stack = [[0, pts.length - 1]];
  const e2 = eps * eps;
  while (stack.length) {
    const [a, b] = stack.pop();
    let best = -1, bd = 0;
    for (let i = a + 1; i < b; i++) {
      const dd = d2(pts[i], pts[a], pts[b]);
      if (dd > bd) { bd = dd; best = i; }
    }
    if (best > 0 && bd > e2) { keep[best] = true; stack.push([a, best], [best, b]); }
  }
  return pts.filter((_, i) => keep[i]);
}

/* ---------------------- PDF writer ---------------------- */
function buildPdf(pages) {
  const bodies = [];
  let num = 3;
  const kids = [];
  pages.forEach(p => {
    const pageNum = num++, contNum = num++, imgNum = num++;
    kids.push(pageNum + ' 0 R');
    let path = '';
    p.loops.forEach(loop => {
      loop.forEach((pt, i) => {
        path += pt[0].toFixed(2) + ' ' + (p.h - pt[1]).toFixed(2) + (i ? ' l\n' : ' m\n');
      });
      path += 'h\n';
    });
    const content = 'q\n' + path + 'W* n\n' +
      p.w.toFixed(2) + ' 0 0 ' + p.h.toFixed(2) + ' 0 0 cm\n/Im0 Do\nQ';
    bodies.push([pageNum, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + p.w.toFixed(2) + ' ' + p.h.toFixed(2) +
      '] /Resources << /XObject << /Im0 ' + imgNum + ' 0 R >> >> /Contents ' + contNum + ' 0 R >>']);
    bodies.push([contNum, '<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream']);
    bodies.push([imgNum, '<< /Type /XObject /Subtype /Image /Width ' + p.iw + ' /Height ' + p.ih +
      ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + p.jpeg.length +
      ' >>\nstream\n' + p.jpeg + '\nendstream']);
  });
  bodies.unshift([2, '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + pages.length + ' >>']);
  bodies.unshift([1, '<< /Type /Catalog /Pages 2 0 R >>']);
  bodies.sort((a, b) => a[0] - b[0]);

  let out = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
  const off = [];
  bodies.forEach(([n, body]) => { off[n] = out.length; out += n + ' 0 obj\n' + body + '\nendobj\n'; });
  const xref = out.length;
  const size = bodies.length + 1;
  out += 'xref\n0 ' + size + '\n0000000000 65535 f \n';
  for (let i = 1; i < size; i++) out += String(off[i]).padStart(10, '0') + ' 00000 n \n';
  out += 'trailer\n<< /Size ' + size + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF';

  const bytes = new Uint8Array(out.length);
  for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 0xff;
  return new Blob([bytes], { type: 'application/pdf' });
}

function jpegBinary(canvas, q) {
  const url = canvas.toDataURL('image/jpeg', q || 0.92);
  return atob(url.split(',')[1]);
}

/* ---------------------- page builders ---------------------- */

/* A frame layer -> page whose vector shape is exactly the frame area */
async function framePage(L) {
  const pts = L.points.map(p => [p.x, p.y]);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), y0 = Math.min(...ys);
  const w = Math.max(2, Math.round(Math.max(...xs) - x0));
  const h = Math.max(2, Math.round(Math.max(...ys) - y0));

  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  c.fillStyle = '#E6E5E3'; c.fillRect(0, 0, w, h);
  const src = L.content && L.content.src;
  if (src) {
    const img = await loadImg(src);
    const s = Math.max(w / img.naturalWidth, h / img.naturalHeight);
    const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
    c.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
  }
  return {
    w, h, iw: w, ih: h,
    loops: [pts.map(p => [p[0] - x0, p[1] - y0])],
    jpeg: jpegBinary(off)
  };
}

/* An image/overlay layer -> page whose vector shape is the traced silhouette */
async function silhouettePage(L) {
  const img = await loadImg(L.src);
  const { loops, scale } = traceAlpha(img, 128, 900);
  if (!loops.length) throw new Error('no transparency found');
  const simplified = loops.map(lp => simplify(lp, 0.7).map(p => [p[0] * scale, p[1] * scale]));
  const all = simplified.flat();
  const xs = all.map(p => p[0]), ys = all.map(p => p[1]);
  const x0 = Math.max(0, Math.min(...xs)), y0 = Math.max(0, Math.min(...ys));
  const w = Math.max(2, Math.round(Math.min(img.naturalWidth, Math.max(...xs)) - x0));
  const h = Math.max(2, Math.round(Math.min(img.naturalHeight, Math.max(...ys)) - y0));

  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  c.fillStyle = '#FFFFFF'; c.fillRect(0, 0, w, h);
  c.drawImage(img, -x0, -y0);
  return {
    w, h, iw: w, ih: h,
    loops: simplified.map(lp => lp.map(p => [p[0] - x0, p[1] - y0])),
    jpeg: jpegBinary(off)
  };
}

/* ---------------------- background removal ---------------------- */
async function removeBg(L, tol) {
  const img = await loadImg(L.src);
  const w = img.naturalWidth, h = img.naturalHeight;
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const c = off.getContext('2d');
  c.drawImage(img, 0, 0);
  const id = c.getImageData(0, 0, w, h), d = id.data;

  const corners = [[0, 0], [w - 1, 0], [0, h - 1], [w - 1, h - 1]].map(([x, y]) => {
    const i = (y * w + x) * 4;
    return [d[i], d[i + 1], d[i + 2]];
  });
  const ref = corners[0];
  const t2 = tol * tol * 3;
  const near = i => {
    for (const cc of corners) {
      const dr = d[i] - cc[0], dg = d[i + 1] - cc[1], db = d[i + 2] - cc[2];
      if (dr * dr + dg * dg + db * db <= t2) return true;
    }
    return false;
  };

  /* flood fill inward from every border pixel so inner colours survive */
  const seen = new Uint8Array(w * h);
  const stack = [];
  for (let x = 0; x < w; x++) { stack.push(x, x + (h - 1) * w); }
  for (let y = 0; y < h; y++) { stack.push(y * w, y * w + w - 1); }
  let cleared = 0;
  while (stack.length) {
    const p = stack.pop();
    if (p < 0 || p >= w * h || seen[p]) continue;
    seen[p] = 1;
    const i = p * 4;
    if (d[i + 3] === 0) { /* already transparent, keep spreading */ }
    else if (!near(i)) continue;
    else { d[i + 3] = 0; cleared++; }
    const x = p % w;
    stack.push(p - w, p + w);
    if (x > 0) stack.push(p - 1);
    if (x < w - 1) stack.push(p + 1);
  }
  if (!cleared) return null;
  c.putImageData(id, 0, 0);
  return { src: off.toDataURL('image/png'), cleared, ref };
}

/* ---------------------------- in-app dialogs ----------------------------
   Some viewers (Edge/Chrome file preview, sandboxed iframes, Notion preview)
   silently block window.confirm / window.prompt, which made buttons look dead.
   These modals are plain DOM, so they always work. */

function uiModal(opts) {
  return new Promise((resolve) => {
    const back = document.createElement('div');
    back.style.cssText = 'position:fixed;inset:0;background:rgba(15,17,21,.45);z-index:9999;display:flex;align-items:center;justify-content:center;font:13px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
    const card = document.createElement('div');
    card.style.cssText = 'background:#fff;border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.28);padding:18px;width:340px;max-width:calc(100vw - 32px)';
    const h = document.createElement('div');
    h.style.cssText = 'font-weight:600;font-size:14px;color:#16181d;margin-bottom:6px';
    h.textContent = opts.title || '';
    const sub = document.createElement('div');
    sub.style.cssText = 'color:#6b7280;margin-bottom:14px';
    sub.textContent = opts.message || '';
    const input = document.createElement('input');
    if (opts.input) {
      input.value = opts.value == null ? '' : String(opts.value);
      input.style.cssText = 'width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #d9dce1;border-radius:8px;font:inherit;margin-bottom:14px;outline:none';
      input.onfocus = () => { input.style.borderColor = '#2f6fed'; };
      input.onblur = () => { input.style.borderColor = '#d9dce1'; };
    }
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:8px;justify-content:flex-end';
    const mk = (label, primary) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.style.cssText = 'padding:7px 14px;border-radius:8px;font:inherit;font-weight:500;cursor:pointer;border:1px solid ' +
        (primary ? '#2f6fed;background:#2f6fed;color:#fff' : '#d9dce1;background:#fff;color:#2b2f36');
      return b;
    };
    const cancel = mk(opts.cancelLabel || 'Cancel', false);
    const ok = mk(opts.confirmLabel || 'OK', true);
    const done = (v) => { document.removeEventListener('keydown', onKey, true); back.remove(); resolve(v); };
    const onKey = (e) => {
      if (e.key === 'Escape') { e.stopPropagation(); e.preventDefault(); done(null); }
      if (e.key === 'Enter') { e.stopPropagation(); e.preventDefault(); done(opts.input ? input.value : true); }
    };
    cancel.onclick = () => done(null);
    ok.onclick = () => done(opts.input ? input.value : true);
    back.onmousedown = (e) => { if (e.target === back) done(null); };
    card.appendChild(h);
    if (opts.message) card.appendChild(sub);
    if (opts.input) card.appendChild(input);
    row.appendChild(cancel); row.appendChild(ok);
    card.appendChild(row);
    back.appendChild(card);
    document.body.appendChild(back);
    document.addEventListener('keydown', onKey, true);
    if (opts.input) { input.focus(); input.select(); } else ok.focus();
  });
}

/* ------------------------- auto screen detection -------------------------
   Takes a mockup image whose screen area is filled with one solid colour
   (yellow / green / magenta etc.), makes that colour transparent, and creates
   a matching frame layer underneath the mockup. One click = reusable mockup. */

function _domColour(d, w, h) {
  const bins = new Map();
  const step = Math.max(1, Math.round(Math.max(w, h) / 500));
  for (let y = 0; y < h; y += step) {
    for (let x = 0; x < w; x += step) {
      const i = (y * w + x) * 4;
      if (d[i + 3] < 128) continue;
      const r = d[i], g = d[i + 1], b = d[i + 2];
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
      if (mx < 60 || (mx - mn) / mx < 0.3) continue; // skip white / grey / black
      const k = ((r >> 4) << 8) | ((g >> 4) << 4) | (b >> 4);
      let e = bins.get(k);
      if (!e) { e = { n: 0, r: 0, g: 0, b: 0 }; bins.set(k, e); }
      e.n++; e.r += r; e.g += g; e.b += b;
    }
  }
  let best = null;
  bins.forEach(e => { if (!best || e.n > best.n) best = e; });
  if (!best || best.n < 25) return null;
  return { r: best.r / best.n, g: best.g / best.n, b: best.b / best.n, n: best.n };
}

async function autoScreen(L, tol) {
  tol = tol || 80;
  const img = await loadImg(L.src);
  const w = img.naturalWidth, h = img.naturalHeight;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);
  const im = ctx.getImageData(0, 0, w, h);
  const d = im.data;

  const t = _domColour(d, w, h);
  if (!t) return null;

  const hard = tol * tol * 3;
  const soft = hard * 3.2;
  let TL = null, TR = null, BR = null, BL = null, cleared = 0;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      if (d[i + 3] < 8) continue;
      const dr = d[i] - t.r, dg = d[i + 1] - t.g, db = d[i + 2] - t.b;
      const dist = dr * dr + dg * dg + db * db;
      if (dist > soft) continue;
      if (dist > hard) { // feather the anti-aliased rim
        d[i + 3] = Math.round(d[i + 3] * ((dist - hard) / (soft - hard)));
        continue;
      }
      d[i + 3] = 0; cleared++;
      const s = x + y, f = x - y;
      if (!TL || s < TL.k) TL = { x, y, k: s };
      if (!BR || s > BR.k) BR = { x, y, k: s };
      if (!TR || f > TR.k) TR = { x, y, k: f };
      if (!BL || f < BL.k) BL = { x, y, k: f };
    }
  }
  if (cleared < (w * h) * 0.005) return null;
  ctx.putImageData(im, 0, 0);

  const sx = L.w / w, sy = L.h / h;
  const pts = [TL, TR, BR, BL].map(p => ({ x: L.x + p.x * sx, y: L.y + p.y * sy }));
  const span = Math.max(L.w, L.h);
  const axis = Math.abs(pts[0].y - pts[1].y) < span * 0.012 &&
               Math.abs(pts[2].y - pts[3].y) < span * 0.012 &&
               Math.abs(pts[0].x - pts[3].x) < span * 0.012 &&
               Math.abs(pts[1].x - pts[2].x) < span * 0.012;

  return { src: c.toDataURL('image/png'), pts, axis, cleared, colour: t };
}

async function autoScreenApply(L, tol) {
  const res = await autoScreen(L, tol);
  if (!res) { toast('No solid-colour screen found — fill the screen area with one flat colour first'); return false; }

  L.src = res.src;
  L.type = 'overlay';
  L.locked = true;
  if (!/overlay|mockup/i.test(L.name || '')) L.name = (L.name || 'Mockup') + ' Overlay';

  const fr = {
    id: uid(), type: 'frame', name: 'Screen Frame',
    frameType: res.axis ? 'rect' : 'perspective',
    visible: true, locked: false, opacity: 1,
    points: res.pts.map(p => ({ x: Math.round(p.x), y: Math.round(p.y) })),
    content: null
  };

  doc.layers.push(L);    // mockup on top
  sel = fr.id;
  contentCache.clear(); imgCache.delete(res.src);
  sync();
  toast('Screen punched out · ' + (res.axis ? 'rect' : '4-point') + ' frame created · drop an image in');
  return true;
}

/* ---------------------- opening -> frame detection ----------------------
   For cut-out artwork (floral arch, photo frame, ornament, phone with the
   screen knocked out...) the opening is either
     a) really transparent, or
     b) a flattened grey/white "transparency checkerboard" baked into pixels.
   Both are detected here: the largest interior background region is traced
   and turned into a polygon frame, and the artwork is made transparent. */

function _holeComponent(w, h, isBg) {
  const lab = new Int32Array(w * h).fill(-1); // -1 = unvisited, 0 = outside
  const stack = [];
  const push = i => { if (lab[i] === -1 && isBg(i)) { lab[i] = 0; stack.push(i) } };
  for (let x = 0; x < w; x++) { push(x); push((h - 1) * w + x) }
  for (let y = 0; y < h; y++) { push(y * w); push(y * w + w - 1) }
  while (stack.length) {
    const i = stack.pop(), x = i % w, y = (i - x) / w;
    if (x > 0) push(i - 1);
    if (x < w - 1) push(i + 1);
    if (y > 0) push(i - w);
    if (y < h - 1) push(i + w);
  }
  let next = 1, bestLab = 0, bestSize = 0;
  for (let i = 0; i < w * h; i++) {

    const id = next++;

    while (stack.length) {
      const j = stack.pop(), x = j % w, y = (j - x) / w;
      size++;
      if (x > 0 && lab[j - 1] === -1 && isBg(j - 1)) { lab[j - 1] = id; stack.push(j - 1) }
      if (x < w - 1 && lab[j + 1] === -1 && isBg(j + 1)) { lab[j + 1] = id; stack.push(j + 1) }
      if (y > 0 && lab[j - w] === -1 && isBg(j - w)) { lab[j - w] = id; stack.push(j - w) }
      if (y < h - 1 && lab[j + w] === -1 && isBg(j + w)) { lab[j + w] = id; stack.push(j + w) }

    if (size > bestSize) { bestSize = size; bestLab = id }

  return { lab, bestLab, bestSize, outsideBg: true };

/* --- morphology on a 0/1 mask (separable, radius r) --- */
function _morph(src, w, h, r, grow) {
  const pass = (inp) => {
    const out = new Uint8Array(w * h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        let v = grow ? 0 : 1;
        for (let k = -r; k <= r; k++) {
          const xx = Math.min(w - 1, Math.max(0, x + k));
          const s = inp[y * w + xx];
          v = grow ? (v | s) : (v & s);

        out[y * w + x] = v;

    const out2 = new Uint8Array(w * h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {

          const yy = Math.min(h - 1, Math.max(0, y + k));
          const s = out[yy * w + x];

  for (let x = 0; x < w; x++) { push(x); push((h - 1) * w + x) }
  for (let y = 0; y < h; y++) { push(y * w); push(y * w + w - 1) }
  while (st.length) {
    const i = st.pop(), x = i % w, y = (i - x) / w;

/* largest 4-connected component of a mask */
function _largest(mask, w, h) {
  const lab = new Int32Array(w * h).fill(0);
