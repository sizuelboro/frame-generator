<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FrameForge — Mockup Frame Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --text:#2C2C2B; --text2:#7D7A75; --canvas:#FFFFFF; --soft:#F9F8F7; --soft2:#F0EFED;
  --border:#E6E5E3; --blue:#2783DE; --blue-soft:#E5F2FC; --green:#46A171; --green-soft:#E8F1EC;
  --orange:#D5803B; --orange-soft:#FBEBDE; --red:#E56458; --red-soft:#FCE9E7;
}
html,body{height:100%}
body{
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text); background:var(--soft); overflow:hidden;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;height:100vh}
.topbar{
  display:flex;align-items:center;gap:12px;padding:10px 16px;
  background:var(--canvas);border-bottom:1px solid var(--border);flex:0 0 auto;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:9px;margin-right:4px}
.logo{width:26px;height:26px;border-radius:7px;background:var(--text);display:grid;place-items:center}
.logo i{display:block;width:11px;height:8px;border:1.6px solid #fff;border-radius:1.5px}
.brand h1{font-size:15px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:12px;color:var(--text2);white-space:nowrap}
.sep{width:1px;height:26px;background:var(--border)}
.spacer{flex:1 1 auto}

.btn{
  display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;
  border:1px solid var(--border);border-radius:8px;background:var(--canvas);
  font-size:13.5px;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--soft2)}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#1f72c4}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft2)}
.btn.sm{min-height:28px;padding:0 9px;font-size:12.5px;border-radius:7px}
.btn.danger{color:var(--red)}
.btn.danger:hover{background:var(--red-soft)}

.body{display:flex;flex:1 1 auto;min-height:0}

/* ---------- panels ---------- */
.panel{
  width:264px;flex:0 0 264px;background:var(--canvas);display:flex;flex-direction:column;
  min-height:0;overflow-y:auto;
}
.panel.left{border-right:1px solid var(--border)}
.panel.right{border-left:1px solid var(--border);width:290px;flex-basis:290px}
.sect{padding:16px;border-bottom:1px solid var(--border)}
.sect:last-child{border-bottom:none}
.sect h2{
  font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text2);margin-bottom:12px;
}
.stack{display:flex;flex-direction:column;gap:7px}
.row{display:flex;gap:7px}
.row>*{flex:1 1 0;min-width:0}

.tool{
  display:flex;align-items:center;gap:9px;width:100%;min-height:38px;padding:0 10px;
  border:1px solid var(--border);border-radius:8px;font-size:13.5px;font-weight:500;text-align:left;
}
.tool:hover{background:var(--soft2)}
.tool.on{background:var(--blue-soft);border-color:#B9DCF7;color:#1a5d9e}
.tool .k{
  margin-left:auto;font-size:10.5px;color:var(--text2);background:var(--soft2);
  border-radius:4px;padding:1px 5px;font-weight:600;
}
.tool.on .k{background:#fff;color:#1a5d9e}
.ic{width:17px;height:17px;flex:0 0 17px;display:block}

/* ---------- layers ---------- */
.layers{display:flex;flex-direction:column;gap:4px}
.layer{
  display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;
  border:1px solid transparent;cursor:pointer;
}
.layer:hover{background:var(--soft)}
.layer.on{background:var(--blue-soft);border-color:#B9DCF7}
.layer .thumb{
  width:30px;height:30px;flex:0 0 30px;border-radius:6px;border:1px solid var(--border);
  background:var(--soft2) center/cover no-repeat;display:grid;place-items:center;overflow:hidden;
}
.layer .meta{flex:1 1 auto;min-width:0}
.layer .nm{font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer .ty{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer.dim .nm,.layer.dim .ty{opacity:.45}
.iconbtn{
  width:26px;height:26px;flex:0 0 26px;border-radius:6px;display:grid;place-items:center;color:var(--text2);
}
.iconbtn:hover{background:var(--soft2);color:var(--text)}
.iconbtn.act{color:var(--blue)}
.empty{font-size:12.5px;color:var(--text2);padding:8px 2px;line-height:1.45}

/* ---------- stage ---------- */
.stage{
  flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column;
  background:var(--soft);position:relative;
}
.stagebar{
  display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);
  background:var(--canvas);flex:0 0 auto;font-size:12.5px;color:var(--text2);flex-wrap:wrap;
}
.pill{
  display:inline-flex;align-items:center;gap:5px;background:var(--soft2);border-radius:999px;
  padding:3px 10px;font-size:11.5px;font-weight:600;color:var(--text);
}
.pill.blue{background:var(--blue-soft);color:#1a5d9e}
.pill.green{background:var(--green-soft);color:#2f7a52}
.pill.orange{background:var(--orange-soft);color:#a25f24}
.canvaswrap{
  flex:1 1 auto;min-height:0;overflow:auto;display:grid;place-items:center;padding:28px;
}
.board{
  position:relative;
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.06);
  background:#fff;border-radius:2px;
}
#cv{display:block;border-radius:2px;touch-action:none}
.hint{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
  background:rgba(44,44,43,.92);color:#fff;font-size:12px;padding:6px 12px;border-radius:999px;
  pointer-events:none;opacity:0;transition:opacity .18s;white-space:nowrap;max-width:92%;
}
.hint.show{opacity:1}

/* ---------- fields ---------- */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;font-weight:600;color:var(--text2)}
.inp{
  width:100%;min-height:32px;padding:5px 9px;border:1px solid var(--border);border-radius:7px;
  background:var(--canvas);font-size:13px;
}
.inp:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
input[type=range]{width:100%;accent-color:var(--blue);min-height:28px}
input[type=color]{width:100%;height:32px;padding:2px;border:1px solid var(--border);border-radius:7px;background:#fff}
.val{font-size:11.5px;color:var(--text2);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--text2);line-height:1.45}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:3px 0}
.kv b{font-weight:600}
.chip{
  display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:7px;
  padding:4px 8px;font-size:12px;font-weight:550;background:var(--canvas);
}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tpl{
  display:flex;align-items:center;gap:9px;padding:7px;border:1px solid var(--border);border-radius:8px;
}
.tpl .thumb{width:42px;height:30px;flex:0 0 42px;border-radius:5px;border:1px solid var(--border);background:var(--soft2) center/cover no-repeat}
.tpl .nm{flex:1 1 auto;min-width:0;font-size:12.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hidden{display:none!important}

@media (max-width:1100px){
  .body{flex-direction:column;overflow-y:auto}
  .panel,.panel.right{width:100%;flex-basis:auto;border:none;border-bottom:1px solid var(--border)}
  .stage{min-height:62vh}
}
</style>

<style id="ff-folder-picker-styles">
.ff-folder-backdrop{position:fixed;inset:0;z-index:20000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(15,17,21,.52);font:14px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#171717}
.ff-folder-dialog{display:grid;gap:16px;width:min(460px,calc(100vw - 32px));max-height:min(680px,calc(100vh - 32px));padding:20px;border:1px solid #e6e5e3;border-radius:14px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.28)}
.ff-folder-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.ff-folder-titles{display:grid;gap:3px}.ff-folder-eyebrow{color:#2783de;font-size:11px;font-weight:750;letter-spacing:.12em}.ff-folder-dialog h2{margin:0;font-size:22px;line-height:1.2}.ff-folder-dialog p{margin:0;color:#6f6d69;font-size:13px}.ff-folder-icon{display:grid;place-items:center;width:36px;height:36px;padding:0;border:1px solid transparent;border-radius:8px;background:#fff;color:#444;font-size:22px;cursor:pointer}.ff-folder-icon:hover{background:#f0efed}
.ff-folder-list{display:grid;gap:6px;min-height:52px;max-height:330px;overflow:auto;padding:2px}.ff-folder-row{display:grid;grid-template-columns:28px minmax(0,1fr) 24px;align-items:center;gap:8px;width:100%;min-height:48px;padding:8px 12px;border:1px solid #e6e5e3;border-radius:10px;background:#fff;color:#2c2c2b;text-align:left;cursor:pointer}.ff-folder-row:hover{background:#f9f8f7}.ff-folder-row.selected{border-color:#8b3dff;background:#f4ecff;color:#5f1abd}.ff-folder-row-icon{font-size:18px}.ff-folder-row-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}.ff-folder-check{font-size:16px;font-weight:750;text-align:center}
.ff-folder-create{display:grid;gap:8px}.ff-folder-new{justify-self:start;min-height:40px;padding:8px 12px;border:1px solid #d9d7d3;border-radius:8px;background:#fff;color:#5f1abd;font-weight:650;cursor:pointer}.ff-folder-new:hover{background:#f4ecff}.ff-folder-fieldrow{display:none;grid-template-columns:minmax(0,1fr) auto;gap:8px}.ff-folder-fieldrow.show{display:grid}.ff-folder-input{min-width:0;height:42px;padding:8px 11px;border:1px solid #b8b6b2;border-radius:8px;font:inherit;outline:none}.ff-folder-input:focus{border-color:#8b3dff;box-shadow:0 0 0 2px rgba(139,61,255,.15)}.ff-folder-add,.ff-folder-primary{min-height:42px;padding:8px 14px;border:1px solid #8b3dff;border-radius:8px;background:#8b3dff;color:#fff;font-weight:700;cursor:pointer}.ff-folder-add:disabled{opacity:.55}.ff-folder-error:empty{display:none}.ff-folder-error{padding:9px 10px;border-radius:8px;background:#fce9e7;color:#9a2820;font-size:12px}.ff-folder-actions{display:flex;justify-content:flex-end;gap:8px}.ff-folder-secondary{min-height:42px;padding:8px 14px;border:1px solid #d9d7d3;border-radius:8px;background:#fff;color:#2c2c2b;font-weight:650;cursor:pointer}
@media(max-width:540px){.ff-folder-backdrop{align-items:flex-end;padding:0}.ff-folder-dialog{width:100%;max-height:88vh;border-radius:16px 16px 0 0;padding:18px}.ff-folder-list{max-height:40vh}}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="logo"><i></i></div>
      <div>
        <h1>FrameForge</h1>
        <span>Mockup frame studio</span>
      </div>
    </div>
    <div class="sep"></div>
    <button class="btn" id="btnNew">New</button>
    <button class="btn" id="btnLoadJson">Open JSON</button>
    <button class="btn" id="btnSaveJson">Save JSON</button>
    <div class="sep"></div>
    <button class="btn" id="btnSaveTpl">Save as mockup</button>
    <div class="spacer"></div>
    <span class="pill" id="sizePill">1200 × 800</span>
    <button class="btn" id="btnFitCanvas">Fit canvas</button>
    <button class="btn" id="btnAutoScreen">Auto screen</button>
    <button class="btn" id="btnSilhouetteFrame" title="Trace the visible subject into one native Canva drop target">Silhouette frame</button>
    <button class="btn" id="btnPickOpening">Pick opening</button>
    <button class="btn" id="btnOpeningBleed" title="Alpha-aware expansion: hides gaps but stops beneath thin artwork borders">Auto bleed: 6px</button>
    <button class="btn" id="btnShadowStrength" title="Rebuild the selected shadow layer at a new strength (capped so it can never read as a frame border)">Shadow: 35%</button>
    <button class="btn" id="btnRemoveBg">Remove bg</button>
    <button class="btn" id="btnSceneExport" title="Export this frame as one ZIP: flat green-keyed PNG plus the ChatGPT prompt">Export for AI</button>
    <button class="btn" id="btnSceneImport" title="Import the realistic scene ChatGPT returned and rebuild the opening from the green area">Import AI scene</button>
    <button class="btn" id="btnExportOverlay">Export overlay PNG</button>
    <button class="btn primary" id="btnExport">Export PNG</button>
  </header>

  <div class="body">

    <!-- LEFT -->
    <aside class="panel left">
      <div class="sect">
        <h2>Add</h2>
        <div class="stack">
          <button class="tool" data-act="addImage">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M4 17l5-4 4 3 3-2 4 3"/></svg>
            Image layer
          </button>
          <button class="tool" data-act="addShadow">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7"/><path d="M14.5 14.5L21 21" opacity=".5"/></svg>
            Shadow layer
          </button>
          <button class="tool" data-act="addOverlay">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="13" height="13" rx="2"/><path d="M8 8h13v13H8z"/></svg>
            Mockup overlay
          </button>
          <button class="tool" data-tool="frameRect">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M3 5l18 14M21 5L3 19" stroke-dasharray="2 2"/></svg>
            Rect frame <span class="k">R</span>
          </button>
          <button class="tool" data-tool="framePersp">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6l16 2v8L4 18z"/><circle cx="4" cy="6" r="1.4" fill="currentColor"/><circle cx="20" cy="8" r="1.4" fill="currentColor"/><circle cx="20" cy="16" r="1.4" fill="currentColor"/><circle cx="4" cy="18" r="1.4" fill="currentColor"/></svg>
            Perspective frame <span class="k">P</span>
          </button>
          <button class="tool" data-tool="text">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 6h14M12 6v13M9 19h6"/></svg>
            Text <span class="k">T</span>
          </button>
          <button class="tool" data-tool="shape">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="9" height="9" rx="1.5"/><circle cx="15.5" cy="15.5" r="4.5"/></svg>
            Shape <span class="k">S</span>
          </button>
        </div>
      </div>

      <div class="sect">
        <h2>Layers <span style="text-transform:none;letter-spacing:0;font-weight:500">(top first)</span></h2>
        <div class="layers" id="layerList"></div>
      </div>

      <div class="sect">
        <h2>Saved mockups</h2>
        <div class="stack" id="tplList"></div>
      </div>
    </aside>

    <!-- STAGE -->
    <main class="stage">
      <div class="stagebar">
        <span class="pill blue" id="modePill">Select</span>
        <span id="stageMsg">Click a frame to select · double-click to edit the image inside</span>
        <div class="spacer"></div>
        <button class="btn sm" id="zoomOut">−</button>
        <span class="val" id="zoomVal" style="min-width:42px;text-align:center">100%</span>
        <button class="btn sm" id="zoomIn">+</button>
        <button class="btn sm" id="zoomFit">Fit</button>
      </div>
      <div class="canvaswrap" id="wrap">
        <div class="board" id="board">
          <canvas id="cv"></canvas>
          <div class="hint" id="hint"></div>
        </div>
      </div>
    </main>

    <!-- RIGHT -->
    <aside class="panel right" id="right"></aside>

  </div>
</div>

<input type="file" id="filePick" accept="image/*" class="hidden" />
<input type="file" id="jsonPick" accept="application/json,.json" class="hidden" />

<!-- =====================================================================
     FrameForge Studio bundle
     ---------------------------------------------------------------------
     These are ordered classic scripts, not ES modules. They share one
     global scope, which is what the original single inline script did,
     so the order below is load-bearing. Adding a file is safe; moving
     one is not.

     01-limits.js is generated. Run:
       node tools/build-studio-limits.mjs
     ===================================================================== -->
<script>
/* Installed before the bundle so nothing is missed. */
window.__ffErrors = [];
window.addEventListener('error', function (e) {
  window.__ffErrors.push('ERROR: ' + (e.message || '') + ' @ ' + String(e.filename || '').split('/').pop() + ':' + e.lineno);
});
window.addEventListener('unhandledrejection', function (e) {
  window.__ffErrors.push('REJECTION: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
});
</script>
<script src="../js/00-demo-overlay.js"></script><!-- bundled demo artwork -->
<script src="../js/01-limits.js"></script><!-- GENERATED from shared/frameforge-limits.js -->
<script src="../js/02-state.js"></script><!-- document state + image cache -->
<script src="../js/03-geometry.js"></script><!-- homography and quad warping -->
<script src="../js/04-render.js"></script><!-- canvas renderer -->
<script src="../js/05-layers.js"></script><!-- layers, tools, hit-testing -->
<script src="../js/06-properties.js"></script><!-- property panel -->
<script src="../js/07-shadow.js"></script><!-- shadow, export, bleed -->
<script src="../js/08-files.js"></script><!-- export, project files, saved mockups, zoom -->
<script src="../js/09-trace.js"></script><!-- tracer, simplifier, background removal -->
<script src="../js/10-dialogs.js"></script><!-- in-app dialogs -->
<script src="../js/11-detect.js"></script><!-- screen + opening detection -->
<script src="../js/12-silhouette.js"></script><!-- silhouette and hole handling -->
<script src="../js/13-scene.js"></script><!-- scene plate and colour key -->
<script src="../js/14-wand.js"></script><!-- magic wand opening -->
<script src="../js/15-download.js"></script><!-- download fallback -->
<script src="../js/16-build-info.js"></script><!-- build marker -->
<script src="../js/17-ratio-presets.js"></script><!-- print-size ratio presets -->
<script src="../js/18-frame-designs.js"></script><!-- generated mitred frame designs -->
<script>
/* =========================================================================
   FrameForge Studio browser test suite
   =========================================================================
   Run with: node tools/test-studio.mjs

   Loads the real script bundle and checks three things:
     1. every module parsed and wired its handlers,
     2. the dialogs that replaced native prompt/confirm behave,
     3. enclosed holes are actually cut out, proved with isPointInPath under
        the nonzero fill rule Canva fills with, and that whatever cannot be
        cut is reported honestly rather than shipped filled.
   ========================================================================= */
'use strict';

var OUT = [];
function chk(name, ok, extra) {
  OUT.push((ok ? 'PASS ' : 'FAIL ') + name + (extra !== undefined && extra !== '' ? ' :: ' + extra : ''));
}
function info(text) { OUT.push('INFO ' + text); }
function section(text) { OUT.push('--- ' + text + ' ---'); }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

/* Both dialog helpers render a card inside a fixed-position backdrop:
   uiForm/uiNumber use a <form>, the older uiModal/uiPrompt use a <div>.
   Return whichever card is currently open. */
function dlg() {
  var nodes = document.body.children;
  for (var i = nodes.length - 1; i >= 0; i--) {
    var node = nodes[i];
    if (node.style && node.style.position === 'fixed' && node.firstElementChild) {
      return node.firstElementChild;
    }
  }
  return null;
}

var probeCtx = (function () {
  var c = document.createElement('canvas');
  c.width = 1; c.height = 1;
  return c.getContext('2d');
})();

function pathsOf(result) {
  return (result.pathDs && result.pathDs.length ? result.pathDs : [result.pathD]).filter(Boolean);
}
/* Ground truth: does the published geometry cover this point? */
function filledAt(ds, x, y) {
  return ds.some(function (d) { return probeCtx.isPointInPath(new Path2D(d), x, y, 'nonzero'); });
}

/* A blue disc with circular bites taken out of it. */
function ringWithHoles(size, rOuter, holes) {
  var c = document.createElement('canvas');
  c.width = size; c.height = size;
  var x = c.getContext('2d');
  x.fillStyle = '#3366cc';
  x.beginPath(); x.arc(size / 2, size / 2, rOuter, 0, Math.PI * 2); x.fill();
  x.globalCompositeOperation = 'destination-out';
  for (var i = 0; i < holes.length; i++) {
    x.beginPath(); x.arc(holes[i][0], holes[i][1], holes[i][2], 0, Math.PI * 2); x.fill();
  }
  return c.toDataURL('image/png');
}
function layerFor(src) {
  return {
    id: 'test-' + Math.random().toString(36).slice(2), type: 'image', name: 'Test',
    src: src, x: 0, y: 0, w: 400, h: 400, rotation: 0,
    visible: true, locked: false, opacity: 1,
  };
}

/* ------------------------------ 1. bundle ------------------------------ */
function testBundle() {
  section('1. bundle loads and wires up');
  chk('no script errors', window.__ffErrors.length === 0, window.__ffErrors.join(' | '));
  chk('FF_LIMITS present', !!window.FF_LIMITS);
  chk('PATH_BUDGET is 1980', window.FF_LIMITS && window.FF_LIMITS.PATH_BUDGET === 1980, String(window.FF_LIMITS && window.FF_LIMITS.PATH_BUDGET));

/* ----------------------- 6. multi-opening detection -----------------------
   A room mockup with three posters used to produce a single frame over the
   largest poster: _openingMask() keeps only `_largest(...)`. These tests pin
   down the new behaviour and, just as importantly, that a single opening is
   unchanged. */

/* A solid card with rectangular windows knocked out of it. */
function cardWithWindows(w, h, windows) {
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var x = c.getContext('2d');
  x.fillStyle = '#d8cfc4';
  x.fillRect(0, 0, w, h);
  x.globalCompositeOperation = 'destination-out';
  for (var i = 0; i < windows.length; i++) {
    var r = windows[i];
    x.fillRect(r[0], r[1], r[2], r[3]);
  }
  return c.toDataURL('image/png');
}
/* A photo with flat-green screens, for the autoScreen() path. */
function cardWithScreens(w, h, screens) {
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var x = c.getContext('2d');
  x.fillStyle = '#8a8a8a';
  x.fillRect(0, 0, w, h);
  x.fillStyle = '#12c412';
  for (var i = 0; i < screens.length; i++) {
    var r = screens[i];
    x.fillRect(r[0], r[1], r[2], r[3]);
  }
  return c.toDataURL('image/png');
}
function overlayLayerFor(src, size) {
  return {
    id: 'mo-' + Math.random().toString(36).slice(2), type: 'image', name: 'Mockup',
    src: src, x: 0, y: 0, w: size, h: size, rotation: 0,
    visible: true, locked: false, opacity: 1,
  };
}
function centreOf(rect) { return [rect[0] + rect[2] / 2, rect[1] + rect[3] / 2]; }
/* How many of the published paths cover this point? */
function coverCount(ds, x, y) {
  var n = 0;
  for (var i = 0; i < ds.length; i++) {
    if (probeCtx.isPointInPath(new Path2D(ds[i]), x, y, 'nonzero')) n++;
  }
  return n;
}

async function testMultiOpening() {
  section('6. multi-opening auto-detect');

  var SIZE = 400;

  /* --- a) one opening: nothing may change ---------------------------- */
  var oneWindow = [140, 120, 120, 160];
  var single = await detectOpening(overlayLayerFor(cardWithWindows(SIZE, SIZE, [oneWindow]), SIZE));
  chk('single opening still detected', !!single);
  if (single) {
    chk('single opening exposes exactly one region', single.openings.length === 1, 'openings=' + single.openings.length);
    chk('openings[0] is the same geometry as pts',
      JSON.stringify(single.openings[0]) === JSON.stringify(single.pts));
    chk('single opening reports nothing skipped', single.skipped === 0, 'skipped=' + single.skipped);
    var box = single.pts.reduce(function (a, p) {
      return { x0: Math.min(a.x0, p.x), y0: Math.min(a.y0, p.y), x1: Math.max(a.x1, p.x), y1: Math.max(a.y1, p.y) };
    }, { x0: 1e9, y0: 1e9, x1: -1e9, y1: -1e9 });
    chk('single opening lands on the real window',
      Math.abs(box.x0 - oneWindow[0]) <= 6 && Math.abs(box.y0 - oneWindow[1]) <= 6 &&
      Math.abs(box.x1 - (oneWindow[0] + oneWindow[2])) <= 6 && Math.abs(box.y1 - (oneWindow[1] + oneWindow[3])) <= 6,
      JSON.stringify(box));
  }

  /* --- b) three posters: all three must survive ---------------------- */
  var three = [[40, 90, 90, 200], [155, 90, 90, 200], [270, 90, 90, 200]];
  var multi = await detectOpening(overlayLayerFor(cardWithWindows(SIZE, SIZE, three), SIZE));
  chk('three-poster mockup detected', !!multi);
  if (multi) {
    chk('all three openings detected', multi.openings.length === 3, 'openings=' + multi.openings.length);
    chk('pts still points at one opening (back-compat)', Array.isArray(multi.pts) && multi.pts.length >= 3);
    var ds = multi.openings.map(function (pts) { return framePath(pts, false); });
    var hits = three.map(function (r) { var c = centreOf(r); return coverCount(ds, c[0], c[1]); });
    chk('each poster centre is covered by exactly one frame', hits.join(',') === '1,1,1', hits.join(','));
    chk('the card between the posters stays solid', coverCount(ds, 130, 190) === 0);
    chk('every opening is its own closed path',
      ds.every(function (d) { return /^M /.test(d) && /Z\s*$/.test(d.trim()) && (d.match(/M /g) || []).length === 1; }));
    var bytes = new TextEncoder().encode(['M 0 0 H 1200 V 800 H 0 Z'].concat(ds).join('')).length;
    chk('three openings fit the combined path budget', bytes <= FF_PATH_BUDGET, bytes + '/' + FF_PATH_BUDGET);
  }

  /* --- c) dust must be filtered, and counted -------------------------
     Specks under a few pixels never reach the filter: the dilate/erode
     close inside _openingMasks() seals them first, so there is nothing to
     report. These specks are deliberately big enough to survive that and
     land on the 0.3% area filter, which must count them. */
  var withDust = await detectOpening(overlayLayerFor(
    cardWithWindows(SIZE, SIZE, [[120, 100, 160, 200], [20, 20, 16, 16], [356, 30, 18, 18]]), SIZE));
  chk('mockup with dust specks detected', !!withDust);
  if (withDust) {
    chk('dust specks do not become frames', withDust.openings.length === 1, 'openings=' + withDust.openings.length);
    chk('skipped regions are reported honestly, not hidden', withDust.skipped >= 2, 'skipped=' + withDust.skipped);
    chk('sub-pixel specks are closed before the filter, so nothing is over-reported',
      (await detectOpening(overlayLayerFor(
        cardWithWindows(SIZE, SIZE, [[120, 100, 160, 200], [20, 20, 4, 4]]), SIZE))).skipped === 0);
  }

  /* --- d) autoScreen: one screen unchanged, three screens split ------ */
  var oneScreen = await autoScreen(overlayLayerFor(cardWithScreens(SIZE, SIZE, [[140, 120, 120, 160]]), SIZE), 80);
  chk('single flat-colour screen still detected', !!oneScreen);
  if (oneScreen) {
    chk('single screen yields one quad', oneScreen.quads.length === 1, 'quads=' + oneScreen.quads.length);
    chk('single screen quad matches the legacy pts',
      JSON.stringify(oneScreen.quads[0].pts) === JSON.stringify(oneScreen.pts));
  }
  var threeScreens = await autoScreen(overlayLayerFor(
    cardWithScreens(SIZE, SIZE, [[30, 90, 90, 200], [155, 90, 90, 200], [280, 90, 90, 200]]), SIZE), 80);
  chk('three flat-colour screens detected', !!threeScreens);
  if (threeScreens) {
    chk('three screens yield three quads', threeScreens.quads.length === 3, 'quads=' + threeScreens.quads.length);
    var quadDs = threeScreens.quads.map(function (q) { return framePath(q.pts, false); });
    chk('each screen centre is covered by exactly one quad',
      [[75, 190], [200, 190], [325, 190]].every(function (p) { return coverCount(quadDs, p[0], p[1]) === 1; }));
    chk('the legacy single quad would have spanned all three screens (the old bug)',
      coverCount([framePath(threeScreens.pts, false)], 130, 190) === 1);
    chk('per-screen quads leave the gap between screens empty', coverCount(quadDs, 130, 190) === 0);
  }

  /* --- e) cost: detection runs once per file ---------------------------
     Chromium runs this suite on a virtual clock, so wall-clock timing is
     meaningless here. Count the morphology passes instead - that is where
     detection spends its time. _holeMask() is computed once and shared by
     the single- and multi-opening paths; without that sharing every mockup
     would pay for two full dilate/erode closes. */
  var realMorph = _morph, morphCalls = 0;
  _morph = function () { morphCalls++; return realMorph.apply(null, arguments); };
  try {
    morphCalls = 0;
    await detectOpening(overlayLayerFor(cardWithWindows(SIZE, SIZE, [oneWindow]), SIZE));
    var singleCalls = morphCalls;
    morphCalls = 0;
    var timed = await detectOpening(overlayLayerFor(cardWithWindows(SIZE, SIZE, three), SIZE));
    var multiCalls = morphCalls;
    info('morphology passes: ' + singleCalls + ' for one opening, ' + multiCalls + ' for three');
    chk('a single-opening mockup costs exactly what it always did',
      singleCalls === 4, 'expected 4 (2 close + 2 open), got ' + singleCalls);
    chk('three openings cost two extra opens per extra region',
      multiCalls === singleCalls + 4, singleCalls + ' -> ' + multiCalls);
    chk('per-file cost grows linearly, not quadratically, with openings',
      multiCalls < singleCalls * 3, singleCalls + ' -> ' + multiCalls);
    chk('1000px three-poster mockup still detected', !!timed && timed.openings.length === 3,
      timed ? 'openings=' + timed.openings.length : 'null');
  } finally {
    _morph = realMorph;
  }

  chk('no runtime errors after multi-opening pass', window.__ffErrors.length === 0, window.__ffErrors.join(' | '));
}

function testFrameDesigns() {
  section('9. generated mitred frame designs');

  chk('FF_FRAME_DESIGNS exposed', Array.isArray(window.FF_FRAME_DESIGNS) && window.FF_FRAME_DESIGNS.length >= 4,
    'count=' + (window.FF_FRAME_DESIGNS || []).length);

  var sw = ffSwatchGold();
  chk('swatch is a square canvas', sw.width === sw.height && sw.width > 0, sw.width + 'x' + sw.height);

  var f = ffBuildMitredFrame(sw, 400, 600, 30);
  chk('frame canvas is the asked size', f.canvas.width === 400 && f.canvas.height === 600,
    f.canvas.width + 'x' + f.canvas.height);
  chk('opening is inset by the border', f.opening.x === 30 && f.opening.y === 30 &&
    f.opening.w === 340 && f.opening.h === 540,
    JSON.stringify(f.opening));

  var x = f.canvas.getContext('2d');
  // the whole point: the opening must be fully transparent so artwork shows
  var mid = x.getImageData(200, 300, 1, 1).data;
  chk('opening is fully transparent', mid[3] === 0, 'alpha=' + mid[3]);
  // and the moulding must be fully opaque
  var bar = x.getImageData(200, 12, 1, 1).data;
  chk('top moulding is opaque', bar[3] === 255, 'alpha=' + bar[3]);
  var side = x.getImageData(12, 300, 1, 1).data;
  chk('left moulding is opaque', side[3] === 255, 'alpha=' + side[3]);

  // mitre: the corner diagonal means a pixel just outside the 45 line on
  // the top bar is painted, while its mirror below the line belongs to the
  // side bar - both opaque, but the join exists rather than overlapping
  var c1 = x.getImageData(5, 3, 1, 1).data;
  var c2 = x.getImageData(3, 5, 1, 1).data;
  chk('both sides of the mitre are painted', c1[3] === 255 && c2[3] === 255,
    c1[3] + '/' + c2[3]);

  // no stretching: every ratio produces its own geometry, and the opening
  // always carries the ratio that was asked for
  for (var i = 0; i < FF_RATIOS.length; i++) {
    var id = FF_RATIOS[i].id;
    var want = ffRatioValue(id, 'portrait');
    var ob = ffRatioBox(id, 'portrait', 1200, 800, 0.62);
    var bw = Math.max(3, Math.round(Math.min(ob.w, ob.h) * 0.075));
    var built = ffBuildMitredFrame(sw, ob.w + bw * 2, ob.h + bw * 2, bw);
    var got = built.opening.w / built.opening.h;
    chk('opening keeps ratio at ' + id, Math.abs(got - want) / want < 0.01,
      got.toFixed(4) + ' vs ' + want.toFixed(4));
  }

  // border is clamped so a fat border can never swallow the opening
  var tiny = ffBuildMitredFrame(sw, 40, 40, 500);
  chk('absurd border is clamped', tiny.opening.w > 0 && tiny.opening.h > 0,
    JSON.stringify(tiny.opening));

  // applying a design puts the overlay and its opening in register
  var before = doc.layers.length;
  var res = ffApplyFrameDesign({ ratioId: '4-5', orientation: 'portrait', designId: 'gold' });
  chk('design applied', !!res);
  chk('two layers added', doc.layers.length === before + 2, String(doc.layers.length - before));

  var ov = doc.layers[doc.layers.length - 1];
  chk('overlay ends up on top', ov.type === 'overlay', ov.type);
  chk('overlay is locked', ov.locked === true);
  chk('overlay carries a PNG', typeof ov.src === 'string' && ov.src.indexOf('data:image/png') === 0);

  var fr = res.frame;
  chk('opening frame recorded the ratio', fr.ratioId === '4-5', String(fr.ratioId));
  var fb = bbox(fr.points);
  chk('opening frame holds 4:5', Math.abs(fb.w / fb.h - 0.8) < 0.01, (fb.w / fb.h).toFixed(4));

  // in register: the opening sits exactly inside the moulding
  chk('opening is inside the overlay',
    fb.x >= ov.x && fb.y >= ov.y &&
    fb.x + fb.w <= ov.x + ov.w + 1 && fb.y + fb.h <= ov.y + ov.h + 1,
    'frame ' + Math.round(fb.x) + ',' + Math.round(fb.y) + ' in overlay ' + ov.x + ',' + ov.y);
  chk('moulding surrounds the opening on all sides',
    Math.abs((fb.x - ov.x) - res.border) <= 1 &&
    Math.abs((ov.x + ov.w) - (fb.x + fb.w) - res.border) <= 1 &&
    Math.abs((fb.y - ov.y) - res.border) <= 1 &&
    Math.abs((ov.y + ov.h) - (fb.y + fb.h) - res.border) <= 1,
    'border=' + res.border);

  doc.layers.length = before;

  chk('no runtime errors after presets and designs', window.__ffErrors.length === 0,
    window.__ffErrors.join(' | '));
}

/* =========================================================================
   New frames go under the mockup without manual reordering
   ========================================================================= */
function testFrameOrdering() {
  section('10. new frames go under the mockup');

  var saved = doc.layers;
  doc.layers = [];
  addLayerTop({ id: uid(), type: 'image', name: 'Photo', visible: true, locked: false, opacity: 1,
    src: '', x: 0, y: 0, w: 10, h: 10, rotation: 0 });
  addLayerTop({ id: uid(), type: 'overlay', name: 'Laptop', visible: true, locked: true, opacity: 1,
    src: '', x: 0, y: 0, w: 10, h: 10, rotation: 0 });
  addLayerTop({ id: uid(), type: 'shadow', name: 'Shadow', visible: true, locked: true, opacity: 1,
    src: '', x: 0, y: 0, w: 10, h: 10, rotation: 0 });

  var a = newFrame('rect', 1, 1, 5, 5);
  addLayerTop(a);
  var b = newFrame('persp', 2, 2, 5, 5);
  addLayerTop(b);
  var types = doc.layers.map(function (l) { return l.type; }).join(',');
  chk('frames are inserted below the lowest overlay or shadow',
    types === 'image,frame,frame,overlay,shadow', types);
  chk('the newest frame is selected', sel === b.id);
  chk('second frame stacks above the first', doc.layers.indexOf(b) > doc.layers.indexOf(a));

  addLayerTop({ id: uid(), type: 'text', name: 'Text', visible: true, locked: false, opacity: 1,
    text: 'x', x: 0, y: 0, size: 10, color: '#000', weight: 700, align: 'left', rotation: 0 });
  chk('non-frame layers still go on top', doc.layers[doc.layers.length - 1].type === 'text');

  doc.layers = [];
  var c = newFrame('rect', 1, 1, 5, 5);
  addLayerTop(c);
  chk('without a mockup a frame simply goes on top', doc.layers.length === 1 && doc.layers[0] === c);

  doc.layers = saved;
  sel = null;
  sync();
}

async function run() {
  try {
    testBundle();
    await testDialogs();
    await testHoles();
    await testHoleReporting();
    await testExistingFeatures();
    await testMultiOpening();
    await testMultiOpeningPipelines();
    testRatioPresets();
    testFrameDesigns();
    testFrameOrdering();
  } catch (error) {
    chk('suite completed without throwing', false, error && error.message);
  }
  var el = document.createElement('div');
  el.id = 'ff-test-report';
  el.textContent = OUT.join('\n');
  document.body.appendChild(el);
}

setTimeout(function () { run(); }, 900);
